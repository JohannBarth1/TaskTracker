<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Studio Board — Daily Planning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">

<!-- PWA: manifest + icons + standalone-app hints -->
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./favicon.ico" sizes="any">
<meta name="theme-color" content="#1a1208">
<link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Studio Board">
<meta name="mobile-web-app-capable" content="yes">

<style>
:root {
  --cream:        #faf6f0;
  --warm-white:   #fffdf9;
  --ink:          #1a1208;
  --brown:        #6b4c2a;
  --rust:         #c0571a;
  --gold:         #c8952a;
  --light-brown:  #e8d5b7;
  --border:       #d4b896;
  --muted:        #8a7060;
  --panel:        #f2ebe0;
  --danger:       #b03030;
  --success:      #2a7a4a;
  --success-pale: #e8f5ee;
  --header-h:     52px;
  --team-h:       36px;
  --toolbar-h:    50px;
  --presence-h:   30px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
/* Stops the mobile pull-to-refresh gesture (swiping down at the top of
   the page) from triggering a full browser reload — that gesture is the
   most common cause of an "unwanted refresh" on Android/iOS. This only
   blocks the rubber-band/refresh overscroll; normal scrolling and drag
   gestures inside the app are unaffected. */
html { overscroll-behavior-y: contain; }
body {
  font-family: 'Lato', sans-serif;
  background: var(--cream);
  color: var(--ink);
  display: flex; flex-direction: column;
  min-height: 100%;
}

/* ── LOGIN ── */
#loginScreen {
  position: fixed; inset: 0;
  background: var(--ink);
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 1.6rem;
  z-index: 999; transition: opacity .4s;
}
#loginScreen.hidden { opacity: 0; pointer-events: none; }
.login-title { font-family: 'Playfair Display', serif; font-size: 2.8rem; color: var(--light-brown); letter-spacing: -.02em; }
.login-sub { font-size: .62rem; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); }
.login-divider { width: 40px; height: 2px; background: var(--gold); opacity: .4; }
.login-prompt { font-size: .82rem; color: var(--muted); letter-spacing: .04em; }
.btn-google {
  display: flex; align-items: center; gap: .75rem;
  padding: .75rem 1.4rem; background: var(--warm-white);
  border: none; border-radius: 3px; cursor: pointer;
  font-family: 'Lato', sans-serif; font-size: .88rem; font-weight: 700;
  color: var(--ink); letter-spacing: .04em;
  box-shadow: 0 2px 10px rgba(0,0,0,.3);
  transition: background .15s, transform .12s;
}
.btn-google:hover { background: #fff; transform: translateY(-1px); }
.btn-google svg { width: 20px; height: 20px; }

/* ── HEADER ── */
/* One sticky wrapper for header + team-bar + toolbar + presence-bar.
   Only this element needs position:sticky — everything inside it just
   stacks in normal document flow, so it's immune to height changes
   (e.g. the toolbar wrapping onto two lines on a narrow screen) that
   previously broke the old per-bar `top: calc(...)` offsets. */
.app-topbar { position: sticky; top: 0; z-index: 40; }

header {
  background: var(--ink); color: var(--cream);
  height: var(--header-h); padding: 0 1rem;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 3px solid var(--gold);
  flex-shrink: 0;
  /* overflow must stay visible — the avatar dropdown is absolutely
     positioned and extends below the header's own box */
}
.brand { display: flex; align-items: baseline; gap: .6rem; white-space: nowrap; flex-shrink: 0; }
.brand-title { font-family: 'Playfair Display', serif; font-size: 1.25rem; color: var(--light-brown); }
.brand-sub { font-size: .58rem; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); }
.header-right { display: flex; align-items: center; gap: .65rem; flex-shrink: 0; }
.user-avatar { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--gold); object-fit: cover; flex-shrink: 0; }
.user-avatar-initials {
  width: 30px; height: 30px; border-radius: 50%;
  border: 2px solid var(--gold); background: var(--brown); color: var(--light-brown);
  font-size: .68rem; font-weight: 700;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: inline-block; transition: background .3s; }
.sync-dot.live { background: var(--success); } .sync-dot.error { background: var(--danger); }
.sync-dot.loading { background: var(--gold); animation: pulse .8s infinite; }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:.3} }

/* ── AVATAR DROPDOWN ── */
.avatar-menu-wrap { position: relative; }
.avatar-btn { background: none; border: none; cursor: pointer; padding: 0; display: flex; }
.avatar-dropdown {
  display: none; position: absolute; top: calc(100% + 8px); right: 0;
  width: 200px; background: var(--warm-white); border: 1px solid var(--border);
  border-radius: 6px; box-shadow: 0 8px 24px rgba(26,18,8,.22); z-index: 200; overflow: hidden;
}
.avatar-dropdown.open { display: block; }
.avatar-dropdown-name { padding: .6rem .8rem; font-size: .78rem; font-weight: 700; color: var(--ink); border-bottom: 1px solid var(--border); background: var(--panel); word-break: break-word; }
.avatar-dropdown-email { font-size: .64rem; color: var(--muted); font-weight: 400; margin-top: 1px; display: block; }
.avatar-dropdown-item {
  width: 100%; text-align: left; background: none; border: none; cursor: pointer;
  padding: .55rem .8rem; font-size: .78rem; color: var(--danger); font-weight: 700;
  font-family: 'Lato', sans-serif; transition: background .12s;
}
.avatar-dropdown-item:hover { background: #fbeaea; }

/* ── TEAM BAR ── */
.team-bar {
  background: var(--panel); border-bottom: 1px solid var(--border);
  min-height: var(--team-h); padding: .3rem 1rem;
  display: flex; align-items: center; justify-content: space-between;
  gap: .4rem .7rem; flex-wrap: wrap;
}
.team-info-group {
  display: flex; align-items: center; gap: .5rem; flex-wrap: wrap;
  min-width: 0; flex: 1 1 auto;
}
.team-switcher { position: relative; flex-shrink: 0; }
.team-switch-btn {
  display: flex; align-items: center; gap: .35rem;
  background: var(--warm-white); border: 1px solid var(--border); border-radius: 20px;
  padding: .3rem .7rem; cursor: pointer; font-family: 'Playfair Display', serif;
  font-style: italic; font-size: .85rem; color: var(--brown); transition: background .15s;
}
.team-switch-btn:hover { background: var(--light-brown); }
.team-chevron { font-size: .6rem; color: var(--muted); }
.team-desc { font-size: .68rem; color: var(--muted); font-style: italic; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 260px; flex-shrink: 1; min-width: 0; }
.team-members-strip { display: flex; align-items: center; gap: 3px; flex-shrink: 0; }
.member-more { font-size: .58rem; color: var(--muted); font-weight: 700; background: var(--light-brown); border-radius: 8px; padding: 1px 5px; }

/* ── PRESENCE (now grouped into the team bar) ── */
.presence-group {
  display: flex; align-items: center; gap: .5rem; flex-wrap: wrap;
  flex-shrink: 0; padding-left: .6rem; border-left: 1px solid var(--border);
}
.presence-label { font-size: .58rem; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 700; flex-shrink: 0; }
.presence-list { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
.presence-chip { display: flex; align-items: center; gap: .3rem; }
.presence-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); flex-shrink: 0; box-shadow: 0 0 0 2px var(--success-pale); }
.presence-name { font-size: .68rem; color: var(--brown); font-weight: 700; }
.presence-empty { font-size: .68rem; color: var(--muted); font-style: italic; }

@media (max-width: 760px) {
  .presence-group { border-left: none; padding-left: 0; }
}

/* ── PERSONAL BOARD MODE ── */
body.scope-mine { background: #f1e6d4; }
body.scope-mine .team-bar, body.scope-mine .toolbar { background: #ece0cb; }
.scope-banner {
  background: var(--brown); color: var(--light-brown); text-align: center;
  font-family: 'Playfair Display', serif; font-style: italic; font-size: .88rem;
  padding: .55rem 1rem; border-radius: 6px; margin-bottom: 1rem; letter-spacing: .02em;
}
.team-chip-mini { font-size: .58rem; padding: 1px 7px; border-radius: 8px; background: var(--panel); border: 1px solid var(--border); color: var(--brown); font-weight: 700; white-space: nowrap; }
body.scope-mine .goal-card { border-left: 3px solid var(--brown); }
.team-menu {
  display: none; position: absolute; top: calc(100% + 6px); left: 0;
  width: 250px; background: var(--warm-white); border: 1px solid var(--border);
  border-radius: 6px; box-shadow: 0 8px 24px rgba(26,18,8,.2); z-index: 200; overflow: hidden;
}
.team-menu.open { display: block; }
.team-menu-label { font-size: .56rem; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: .5rem .8rem .2rem; }
.team-menu-list { max-height: 200px; overflow-y: auto; }
.team-menu-team {
  width: 100%; text-align: left; background: none; border: none; cursor: pointer;
  padding: .45rem .8rem; font-size: .8rem; color: var(--ink); font-family: 'Lato', sans-serif;
  transition: background .12s; display: block;
}
.team-menu-team:hover { background: var(--panel); }
.team-menu-team.active { background: var(--light-brown); font-weight: 700; }
.team-menu-divider { height: 1px; background: var(--border); margin: .2rem 0; }
.team-menu-item {
  width: 100%; text-align: left; background: none; border: none; cursor: pointer;
  padding: .5rem .8rem; font-size: .78rem; color: var(--brown); font-weight: 700;
  font-family: 'Lato', sans-serif; transition: background .12s;
}
.team-menu-item:hover { background: var(--panel); }

/* Inline dropdowns used inside the goal edit form (Owner / Team pickers) —
   same visual language as the team-switcher menu above. */
.inline-dd-wrap { position: relative; min-width: 0; display: inline-flex; }
.inline-dd-menu {
  display: none; position: absolute; top: calc(100% + 4px); left: 0; min-width: 190px; max-width: 260px;
  max-height: 220px; overflow-y: auto; background: var(--warm-white); border: 1px solid var(--border);
  border-radius: 6px; box-shadow: 0 8px 24px rgba(26,18,8,.2); z-index: 210;
}
.inline-dd-menu.open { display: block; }
.inline-dd-item {
  width: 100%; display: flex; align-items: center; gap: .4rem; text-align: left;
  background: none; border: none; cursor: pointer; padding: .4rem .6rem;
  font-size: .78rem; color: var(--ink); font-family: 'Lato', sans-serif; transition: background .12s;
}
.inline-dd-item:hover { background: var(--panel); }
.inline-dd-item.active { background: var(--light-brown); font-weight: 700; }
.inline-dd-empty { padding: .5rem .6rem; font-size: .72rem; color: var(--muted); font-style: italic; }

/* ── TOOLBAR / WEEK NAV ── */
.toolbar {
  background: var(--panel); border-bottom: 1px solid var(--border);
  padding: 0 1rem; height: var(--toolbar-h);
  display: flex; align-items: center; gap: .6rem;
  overflow-x: auto; overflow-y: hidden;
  scrollbar-width: none;
}
.toolbar::-webkit-scrollbar { display: none; }
.week-nav-btn {
  width: 26px; height: 26px; border-radius: 50%;
  border: 1px solid var(--border); background: var(--warm-white); color: var(--brown);
  cursor: pointer; font-size: .8rem; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s;
}
.week-nav-btn:hover { background: var(--light-brown); }
.week-label { font-family: 'Playfair Display', serif; font-style: italic; font-size: .88rem; color: var(--brown); white-space: nowrap; flex-shrink: 0; }
.toolbar-spacer { flex: 1; min-width: .25rem; }

.toggle-group { display: flex; align-items: center; gap: .35rem; flex-shrink: 0; }
.toggle-cap { font-size: .5rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; white-space: nowrap; }
.toggle-divider { width: 1px; height: 20px; background: var(--border); flex-shrink: 0; }

.vpill {
  font-family: 'Playfair Display', serif; font-style: italic; font-size: .8rem;
  color: var(--muted); padding: 3px 12px; border-radius: 20px;
  border: 1px solid transparent; background: transparent; cursor: pointer;
  transition: all .15s; white-space: nowrap;
}
.vpill:hover { color: var(--brown); border-color: var(--border); }
.vpill.active { background: var(--ink); color: var(--light-brown); border-color: var(--ink); font-style: normal; font-weight: 700; letter-spacing: .03em; }

/* scope pills get their own accent color so they're visually distinct from the view pills */
.spill {
  font-family: 'Playfair Display', serif; font-style: italic; font-size: .8rem;
  color: var(--muted); padding: 3px 12px; border-radius: 20px;
  border: 1px solid transparent; background: transparent; cursor: pointer;
  transition: all .15s; white-space: nowrap;
}
.spill:hover { color: var(--rust); border-color: var(--border); }
.spill.active { background: var(--rust); color: #fff; border-color: var(--rust); font-style: normal; font-weight: 700; letter-spacing: .03em; }

.today-jump {
  font-size: .62rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 700;
  color: var(--rust); background: none; border: 1px solid var(--rust); border-radius: 20px;
  padding: 4px 10px; cursor: pointer; flex-shrink: 0; transition: all .15s;
}
.today-jump:hover { background: var(--rust); color: #fff; }

/* ── DAY PICKER (Today view) ── */
.day-picker { display: flex; justify-content: center; gap: .35rem; flex-wrap: wrap; margin-bottom: 1rem; }
.daypill {
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  min-width: 46px; padding: .35rem .3rem .3rem; border-radius: 8px;
  border: 1px solid var(--border); background: var(--warm-white); cursor: pointer;
  transition: all .15s; position: relative;
}
.daypill:hover { background: var(--light-brown); }
.daypill.active { background: var(--ink); border-color: var(--ink); }
.daypill.active .daypill-name, .daypill.active .daypill-date { color: var(--light-brown); }
.daypill.is-today:not(.active) { border-color: var(--rust); border-width: 2px; }
.daypill.is-past:not(.active) { opacity: .5; }
.daypill-name { font-size: .6rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.daypill-date { font-family: 'Playfair Display', serif; font-size: 1rem; color: var(--brown); }
.daypill.active .daypill-date { color: var(--light-brown); }
.daypill-tag { font-size: .48rem; letter-spacing: .08em; text-transform: uppercase; color: var(--rust); font-weight: 900; }
.daypill.active .daypill-tag { color: var(--gold); }
.past-note { text-align: center; font-size: .68rem; color: var(--muted); font-style: italic; margin: -.4rem 0 1rem; }

/* ── EDIT PANEL (owner / date / slot / visibility) ── */
.goal-edit-form { margin-top: .55rem; padding: .55rem .6rem; background: var(--panel); border-radius: 6px; display: flex; flex-direction: column; gap: .5rem; }
/* Grid (not flex) so the label column stays a fixed width even when its
   row's content wraps — this is what actually keeps every row's controls
   lined up under one another, rather than drifting per-row. */
.edit-row { display: grid; grid-template-columns: 58px 1fr; align-items: center; column-gap: .5rem; }
.edit-row label { font-size: .62rem; color: var(--muted); font-weight: 700; white-space: nowrap; }
.edit-row select, .edit-row input { width: 100%; padding: .32rem .45rem; border: 1px solid var(--border); border-radius: 999px; font-family: 'Lato', sans-serif; font-size: .8rem; background: var(--warm-white); outline: none; }
.edit-row select:focus, .edit-row input:focus { border-color: var(--gold); }
.edit-actions { display: flex; gap: .4rem; justify-content: flex-end; }
.gact.save { background: var(--gold); color: #fff; border-color: var(--gold); }
.gact.save:hover { background: #a87820; color: #fff; }

/* Slot + Visibility share one compact row instead of two full-width ones */
.edit-row-split { display: flex; gap: .8rem; }
.split-col { flex: 1; display: flex; flex-direction: column; gap: .25rem; min-width: 0; }
.split-label { font-size: .56rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }

/* Pill toggles — used for Slot / Visibility / Effort / Reward in the edit form */
.pill-toggle-group { display: flex; gap: .3rem; flex-wrap: wrap; }
.pill-toggle {
  font-family: 'Lato', sans-serif; font-size: .74rem; font-weight: 700;
  padding: .3rem .65rem; border-radius: 999px; border: 1px solid var(--border);
  background: var(--warm-white); color: var(--muted); cursor: pointer; transition: all .15s;
}
.pill-toggle:hover { border-color: var(--gold); color: var(--brown); }
.pill-toggle.active { background: var(--gold); color: #fff; border-color: var(--gold); }

/* Priority box — visually groups Effort + Reward as one related unit */
.priority-box { border: 1px solid var(--border); border-radius: 10px; padding: .5rem .6rem; background: var(--panel); display: flex; flex-direction: column; gap: .4rem; }
.priority-box-hdr { font-size: .56rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.priority-box-row { display: grid; grid-template-columns: 50px 1fr; align-items: center; column-gap: .5rem; }
.priority-box-label { font-size: .7rem; font-weight: 700; color: var(--brown); }

/* ── DRAG & DROP ── */
.goal-card[draggable="true"] { cursor: grab; }
.goal-card.dragging { opacity: .35; }
.goal-list { border-radius: 6px; transition: background .12s, outline .12s; min-height: 8px; }
.goal-list.drag-over { background: var(--light-brown); outline: 2px dashed var(--gold); outline-offset: 2px; }
.goal-list.drag-over-blocked, .wk-slot-body.drag-over-blocked { background: #f5dede; outline: 2px dashed var(--danger); outline-offset: 2px; cursor: not-allowed; }
.wk-slot-body { border-radius: 4px; transition: background .12s, outline .12s; min-height: 6px; }
.wk-slot-body.drag-over { background: var(--light-brown); outline: 2px dashed var(--gold); outline-offset: 1px; }
.wk-goal[draggable="true"] { cursor: grab; }
.wk-goal.dragging { opacity: .35; }
.drag-hint { text-align: center; font-size: .62rem; color: var(--muted); font-style: italic; margin: -.5rem 0 .8rem; }

/* ── MAIN ── */
.main { flex: 1; padding: 1rem 1rem 5rem; max-width: 1400px; width: 100%; margin: 0; }

/* The Scratchboard sits on the left alongside whatever view is active
   (Day/Week/Matrix) — one persistent sidebar, not something that
   disappears when you switch views. */
.app-shell { display: flex; gap: 1.2rem; align-items: flex-start; }
.board-content { flex: 1; min-width: 0; max-width: 640px; }
.board-content.wide { max-width: none; }
/* Matrix view renders the Completed panel inline, right under the matrix
   itself (see render()), so it's a child of board-content and therefore
   always exactly as wide as the matrix — the separate right-hand column
   is hidden in this view instead. */
.matrix-completed-panel { margin-top: 1rem; }

/* ── TODAY VIEW ── */
.today-hero { text-align: center; margin-bottom: 1.1rem; }
.today-hero-day { font-family: 'Playfair Display', serif; font-style: italic; font-size: 1.7rem; color: var(--brown); }
.today-hero-sub { font-size: .62rem; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin-top: .1rem; }

.slot-section { margin-bottom: 1.3rem; }
.slot-hdr { display: flex; align-items: center; gap: .5rem; margin-bottom: .5rem; }
.slot-icon { font-size: 1rem; }
.slot-title { font-family: 'Playfair Display', serif; font-size: 1rem; color: var(--brown); }
.slot-count { background: var(--light-brown); color: var(--brown); border-radius: 10px; font-size: .6rem; font-weight: 700; padding: 1px 7px; }
.slot-line { flex: 1; height: 1px; background: var(--border); }

.goal-list { display: flex; flex-direction: column; gap: .5rem; }
.goal-card {
  background: var(--warm-white); border: 1px solid var(--border); border-radius: 6px;
  padding: .6rem .8rem; display: flex; align-items: flex-start; gap: .6rem;
  position: relative; transition: background .15s;
}
.goal-card.completed { background: var(--success-pale); border-color: rgba(42,122,74,.3); }
.goal-card.is-private { border-left: 3px solid var(--brown); }
/* "My tasks" get a distinct gold-tinted treatment in Team Board so they
   stand out from teammates' goals at a glance, not just via small owner text. */
.goal-card.is-mine { border-left: 3px solid var(--gold); background: #fffbf0; }
.goal-card.is-mine.is-private { border-left: 3px solid var(--gold); } /* gold wins over brown when both apply */
.mine-badge { font-size: .58rem; color: var(--gold); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.wk-goal.is-mine { border-left: 3px solid var(--gold); background: #fffbf0; }
.goal-check {
  width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; margin-top: 1px;
  border: 2px solid var(--border); background: transparent; cursor: pointer;
  display: flex; align-items: center; justify-content: center; font-size: .7rem; color: transparent;
  transition: all .15s;
}
.goal-check:hover { border-color: var(--success); }
.goal-card.completed .goal-check { background: var(--success); border-color: var(--success); color: #fff; }
.goal-body { flex: 1; min-width: 0; }
.goal-text { font-size: .9rem; line-height: 1.4; word-break: break-word; cursor: text; }
.goal-text:hover { background: rgba(200,149,42,.12); border-radius: 3px; }
.goal-text-input {
  width: 100%; font-family: 'Lato', sans-serif; font-size: .9rem; line-height: 1.4;
  padding: .1rem .3rem; border: 1px solid var(--gold); border-radius: 4px; background: var(--warm-white); outline: none;
}
.goal-card.completed .goal-text { text-decoration: line-through; color: var(--muted); }
.goal-meta { display: flex; align-items: center; gap: .5rem; margin-top: .32rem; flex-wrap: wrap; }
.goal-owner { display: flex; align-items: center; gap: .32rem; }
.owner-avatar { width: 18px; height: 18px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
.owner-avatar-init { width: 18px; height: 18px; border-radius: 50%; background: var(--brown); color: var(--light-brown); font-size: .5rem; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.owner-name { font-size: .7rem; color: var(--muted); font-weight: 700; }
.rolled-badge { font-size: .58rem; color: var(--gold); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
/* Owner / team / visibility are editable right on the tile now — these
   tags double as buttons, so give them pointer + hover feedback without
   disturbing the badge-specific colors/borders each already carries. */
.meta-tag-btn { cursor: pointer; font-family: inherit; outline: none; transition: opacity .15s; }
.meta-tag-btn:hover { opacity: .72; }
.goal-owner.meta-tag-btn { border: none; background: none; padding: 0; margin: 0; }
.private-badge { font-size: .82rem; line-height: 1; border: none; background: none; padding: 2px; margin: 0; }
.team-chip-mini { font-size: .64rem; padding: 2px 8px; border-radius: 9px; }
.goal-actions { display: flex; flex-direction: column; align-items: flex-end; gap: .3rem; flex-shrink: 0; }
.goal-actions-row { display: flex; gap: .3rem; }
.goal-actions .rolled-badge { margin-top: -.05rem; }
.gact {
  background: none; border: 1px solid var(--border); border-radius: 999px; cursor: pointer;
  font-size: .65rem; padding: .25rem .6rem; color: var(--muted); transition: all .15s;
}
.gact:hover { border-color: var(--rust); color: var(--rust); }
.gact.roll:hover { border-color: var(--gold); color: var(--gold); }
.gact.del:hover { border-color: var(--danger); color: var(--danger); }

.add-goal-row { display: flex; gap: .4rem; margin-top: .5rem; }
.add-goal-input {
  flex: 1; padding: .5rem .7rem; font-family: 'Lato', sans-serif; font-size: .88rem;
  border: 1px dashed var(--border); border-radius: 6px; background: var(--cream); outline: none;
  transition: border-color .15s;
}
.add-goal-input:focus { border-color: var(--gold); border-style: solid; background: var(--warm-white); }
.add-goal-btn {
  background: var(--rust); color: #fff; border: none; border-radius: 999px; padding: .5rem 1.1rem;
  font-size: .78rem; font-weight: 700; cursor: pointer; flex-shrink: 0; transition: background .15s;
}
.add-goal-btn:hover { background: #a04415; }
.empty-slot { font-size: .78rem; color: var(--muted); font-style: italic; padding: .3rem 0 .6rem; }
.add-goal-note { font-size: .62rem; color: var(--muted); font-style: italic; margin-top: .25rem; }
.add-goal-locked { font-size: .74rem; color: var(--muted); font-style: italic; padding: .5rem .1rem; opacity: .8; }

/* ── WEEK VIEW ── */
.week-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: .6rem; }
.day-col { border: 1px solid var(--border); border-radius: 6px; background: var(--warm-white); overflow: hidden; }
.day-col.is-today { border-color: var(--rust); box-shadow: 0 0 0 1px var(--rust); }
.day-col.is-past { opacity: .55; filter: grayscale(.35); }
.day-col-locked { font-size: .5rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-top: 1px; }
.day-col-hdr { background: var(--panel); padding: .4rem .5rem; text-align: center; border-bottom: 1px solid var(--border); }
.day-col-name { font-family: 'Playfair Display', serif; font-size: .82rem; color: var(--brown); }
.day-col-date { font-size: .58rem; color: var(--muted); }
.day-col-body { padding: .45rem; display: flex; flex-direction: column; gap: .5rem; }
.wk-slot-label { font-size: .55rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: .2rem; }
.wk-goal { font-size: .72rem; padding: .25rem .4rem; border-radius: 4px; background: var(--cream); border: 1px solid var(--border); margin-bottom: .25rem; word-break: break-word; }
.wk-goal.completed { background: var(--success-pale); text-decoration: line-through; color: var(--muted); border-color: rgba(42,122,74,.3); }
.wk-goal.is-private { border-left: 2px solid var(--brown); }
.wk-goal-owner { font-size: .58rem; color: var(--muted); display: block; margin-top: 1px; }
.wk-empty { font-size: .68rem; color: var(--muted); font-style: italic; }

@media (max-width: 800px) {
  .week-grid { grid-template-columns: 1fr; }
}

/* ── PRIORITY MATRIX (My Board only) ── */
.matrix-intro { text-align: center; font-size: .68rem; color: var(--muted); font-style: italic; margin-bottom: 1rem; }
.matrix-unrated { margin-bottom: 1.1rem; }
.matrix-unrated-hdr { display: flex; align-items: center; gap: .5rem; margin-bottom: .5rem; }
.matrix-unrated-title { font-family: 'Playfair Display', serif; font-size: .9rem; color: var(--brown); }
.matrix-unrated-line { flex: 1; height: 1px; background: var(--border); }
.matrix-unrated-tray {
  display: flex; gap: .5rem; overflow-x: auto; padding-bottom: .3rem;
  border-radius: 6px; transition: background .12s, outline .12s; min-height: 40px;
}
.matrix-unrated-tray.drag-over { background: var(--light-brown); outline: 2px dashed var(--gold); }
.matrix-unrated-empty { font-size: .74rem; color: var(--muted); font-style: italic; padding: .3rem; }

.matrix-wrap { display: flex; gap: .5rem; }
.matrix-axis-y { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .3rem; width: 20px; flex-shrink: 0; }
.matrix-axis-y .axis-arrow { font-size: .65rem; color: var(--muted); line-height: 1; }
.matrix-axis-y .axis-word { writing-mode: vertical-rl; transform: rotate(180deg); font-family: 'Playfair Display', serif; font-style: italic; font-size: .72rem; color: var(--muted); letter-spacing: .04em; white-space: nowrap; }
.matrix-main { flex: 1; min-width: 0; }
.matrix-grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: .6rem; min-height: 380px; }
.matrix-quad {
  border: 1px solid var(--border); border-radius: 8px; padding: .6rem;
  display: flex; flex-direction: column; gap: .4rem; overflow-y: auto;
  transition: background .12s, outline .12s, box-shadow .15s; cursor: pointer;
}
.matrix-quad.drag-over { outline: 2px dashed var(--gold); }
.matrix-quad.selected { box-shadow: 0 0 0 2px var(--rust) inset; }
.quad-compose-row input {
  width: 100%; padding: .35rem .6rem; border: 1px solid var(--rust); border-radius: 999px;
  font-family: 'Lato', sans-serif; font-size: .8rem; background: var(--warm-white); outline: none;
}
.matrix-quad.q-hi-hi { background: var(--success-pale); }
.matrix-quad.q-lo-hi { background: #eef6ea; }
.matrix-quad.q-hi-lo { background: #f2ebe0; }
.matrix-quad.q-lo-lo { background: #f9ebe8; }
.matrix-quad-title { font-family: 'Playfair Display', serif; font-size: .85rem; color: var(--brown); }
.matrix-quad-sub { font-size: .56rem; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; font-weight: 700; margin-top: -.3rem; }
.matrix-quad-empty { font-size: .7rem; color: var(--muted); font-style: italic; }
.matrix-axis-x { display: flex; justify-content: center; font-family: 'Playfair Display', serif; font-style: italic; font-size: .72rem; color: var(--muted); letter-spacing: .04em; padding: .35rem .3rem 0; }

.matrix-goal { background: var(--warm-white); border: 1px solid var(--border); border-radius: 6px; padding: .4rem .55rem; cursor: grab; transition: opacity .15s; }
.matrix-goal.dragging { opacity: .35; }
.matrix-goal-text { font-size: .78rem; line-height: 1.35; word-break: break-word; }
.matrix-goal-meta { font-size: .6rem; color: var(--muted); margin-top: 3px; display: flex; gap: .35rem; flex-wrap: wrap; align-items: center; }

/* ── SCRATCHBOARD SIDEBAR (+ its Quick Add box above it) ── */
.scratch-sidebar-col {
  flex: 0 0 380px; min-width: 280px; max-width: 420px;
  display: flex; flex-direction: column; gap: .8rem;
}
.quick-add-box {
  border: 1px solid var(--rust); border-radius: 8px; background: #fff7ef;
  padding: .6rem .7rem; display: flex; flex-direction: column; gap: .4rem;
}
.quick-add-label { font-size: .62rem; letter-spacing: .08em; text-transform: uppercase; color: var(--rust); font-weight: 700; }
.scratch-sidebar {
  border: 1px solid var(--border); border-radius: 8px; background: var(--warm-white);
  padding: .8rem .9rem; display: flex; flex-direction: column; gap: .7rem;
}

/* ── COMPLETED TASKS PANEL — sits underneath whatever view is on screen
   (Day/Week/Matrix), never off to the side. Renders real goal-card tiles
   (same component as every other list), so it's editable and draggable
   just like the rest of the app — checkbox, tags, roll/delete, drag out
   into a day/slot. ── */
.completed-panel {
  border: 1px solid var(--border); border-radius: 8px; background: var(--warm-white);
  padding: .8rem .9rem; display: flex; flex-direction: column; gap: .5rem;
}
.board-completed-panel { margin-top: 1.2rem; }
.completed-count { font-size: .58rem; background: var(--success-pale); color: var(--success); border-radius: 10px; padding: 1px 7px; font-weight: 700; vertical-align: middle; margin-left: .3rem; }
.completed-groups { display: flex; flex-direction: column; gap: .4rem; max-height: 70vh; overflow-y: auto; }
.completed-empty { font-size: .72rem; color: var(--muted); font-style: italic; }
/* Day groups — collapsed by default except Today, per group. */
.completed-day-group { border-top: 1px solid var(--border); padding-top: .4rem; }
.completed-day-group:first-child { border-top: none; padding-top: 0; }
.completed-day-hdr {
  width: 100%; display: flex; align-items: center; gap: .4rem; background: none; border: none;
  cursor: pointer; padding: .15rem 0; font-family: 'Playfair Display', serif; font-style: italic;
  font-size: .85rem; color: var(--brown); text-align: left;
}
.completed-day-chevron { font-size: .65rem; color: var(--muted); flex-shrink: 0; width: .8rem; }
.completed-day-label { flex: 1; min-width: 0; }
.completed-day-body { margin-top: .4rem; padding-left: 1.2rem; }
.completed-board { opacity: .92; }
.board-color-swatch {
  width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--border);
  padding: 0; cursor: pointer; flex-shrink: 0; background: none; overflow: hidden;
}
.board-color-swatch::-webkit-color-swatch-wrapper { padding: 0; border-radius: 50%; }
.board-color-swatch::-webkit-color-swatch { border: none; border-radius: 50%; }
.board-color-swatch::-moz-color-swatch { border: none; border-radius: 50%; }
.board-visibility-btn {
  width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--border);
  background: var(--warm-white); cursor: pointer; flex-shrink: 0; font-size: .78rem;
  display: flex; align-items: center; justify-content: center; padding: 0; transition: background .15s;
}
.board-visibility-btn.public { background: var(--success-pale); border-color: var(--success); }
.shared-board { opacity: .92; }
.shared-board-title { display: flex; align-items: center; font-family: 'Playfair Display', serif; font-style: italic; font-size: .9rem; color: var(--brown); padding: .3rem .1rem; flex: 1; min-width: 0; }
.shared-board-owner { font-size: .62rem; color: var(--muted); font-style: italic; margin-top: -.3rem; }
.note-line.shared { padding: .1rem 0; }
.shared-line-text { font-size: .78rem; line-height: 1.35; color: var(--brown); }
.notes-hdr { display: flex; flex-direction: column; gap: .2rem; margin-bottom: .2rem; }
.notes-title { font-family: 'Playfair Display', serif; font-size: 1.05rem; color: var(--brown); }
.notes-sub { font-size: .68rem; color: var(--muted); line-height: 1.4; }
.scratch-boards-list { display: flex; flex-direction: column; gap: .8rem; }

.scratch-board { border: 1px solid var(--border); border-radius: 8px; background: var(--panel); padding: .6rem .65rem; display: flex; flex-direction: column; gap: .45rem; }
.scratch-board-hdr { display: flex; align-items: center; gap: .4rem; }
.board-title-input {
  flex: 1; min-width: 0; padding: .3rem .65rem; border: 1px solid var(--border); border-radius: 999px;
  font-family: 'Playfair Display', serif; font-style: italic; font-size: .9rem; color: var(--brown);
  background: var(--warm-white); outline: none; transition: border-color .15s;
}
.board-title-input:focus { border-color: var(--gold); }
.board-add-line { align-self: flex-start; }

.notes-lines { display: flex; flex-direction: column; gap: .4rem; }
.note-line { display: flex; align-items: flex-start; gap: .3rem; transition: opacity .15s; }
.note-line.dragging { opacity: .35; }
.note-drag-handle { cursor: grab; color: var(--muted); font-size: .85rem; padding: .35rem .1rem 0 0; flex-shrink: 0; user-select: none; }
.note-drag-handle:hover { color: var(--gold); }
.scratch-board { transition: outline .12s, background .12s; }
.scratch-board.drag-over { outline: 2px dashed var(--gold); outline-offset: 2px; }
.note-line textarea {
  flex: 1; min-width: 0; padding: .45rem .7rem; border: 1px solid var(--border); border-radius: 14px;
  font-family: 'Lato', sans-serif; font-size: .84rem; line-height: 1.4; background: var(--cream); outline: none;
  transition: border-color .15s; resize: none; overflow: hidden; min-height: 2.1rem;
}
.note-line textarea:focus { border-color: var(--gold); background: var(--warm-white); }
.note-line.converted textarea { color: var(--muted); text-decoration: line-through; background: var(--success-pale); }
.note-convert-btn, .note-del-btn {
  background: none; border: 1px solid var(--border); border-radius: 999px; cursor: pointer;
  font-size: .72rem; width: 26px; height: 26px; flex-shrink: 0; color: var(--muted); transition: all .15s;
  display: flex; align-items: center; justify-content: center; margin-top: .1rem;
}
.note-convert-btn:hover { border-color: var(--gold); color: var(--gold); }
.note-convert-btn:disabled { color: var(--success); border-color: var(--success); cursor: default; opacity: .8; }
.note-del-btn:hover { border-color: var(--danger); color: var(--danger); }

/* ── MODAL ── */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,18,8,.55); z-index: 300; align-items: center; justify-content: center; padding: 1rem; }
.modal-overlay.open { display: flex; }
.modal { background: var(--warm-white); border: 1px solid var(--border); border-radius: 6px; padding: 1.6rem; width: 100%; max-width: 440px; box-shadow: 0 8px 32px rgba(26,18,8,.2); }
.modal h3 { font-family: 'Playfair Display', serif; font-size: 1.2rem; color: var(--brown); margin-bottom: 1rem; }
.form-row { margin-bottom: .8rem; }
.form-row label { display: block; font-size: .6rem; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: .28rem; }
.form-row input, .form-row textarea { width: 100%; padding: .55rem .8rem; font-family: 'Lato', sans-serif; font-size: .92rem; color: var(--ink); background: var(--cream); border: 1px solid var(--border); border-radius: 3px; outline: none; transition: border-color .15s; }
.form-row input:focus, .form-row textarea:focus { border-color: var(--gold); }
.form-row textarea { resize: vertical; min-height: 64px; line-height: 1.5; }
.form-note { font-size: .72rem; color: var(--muted); }
.form-note code { background: var(--panel); padding: 1px 5px; border-radius: 3px; font-size: .7rem; word-break: break-all; }
.modal-actions { display: flex; gap: .5rem; justify-content: flex-end; margin-top: 1rem; }
.btn { border: none; padding: .42rem .95rem; font-family: 'Lato', sans-serif; font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; border-radius: 999px; transition: background .15s; white-space: nowrap; }
.btn-save { background: var(--rust); color: #fff; } .btn-save:hover { background: #a04415; }
.btn-cancel { background: transparent; color: var(--muted); border: 1px solid var(--border); } .btn-cancel:hover { background: var(--light-brown); }

/* ── LOADING / TOAST ── */
#loadingScreen { position: fixed; inset: 0; background: var(--cream); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 1rem; z-index: 998; transition: opacity .4s; }
#loadingScreen.hidden { opacity: 0; pointer-events: none; }
.loading-title { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--brown); }
.loading-bar { width: 140px; height: 3px; background: var(--light-brown); border-radius: 2px; overflow: hidden; }
.loading-bar-inner { height: 100%; background: var(--gold); animation: loadSlide 1.2s ease-in-out infinite; }
@keyframes loadSlide { 0%{transform:translateX(-100%);width:40%}50%{width:60%}100%{transform:translateX(300%);width:40%} }
.toast { position: fixed; bottom: 1.4rem; right: 1.8rem; background: var(--ink); color: var(--light-brown); padding: .6rem 1.1rem; border-radius: 3px; font-size: .82rem; font-weight: 700; opacity: 0; transform: translateY(6px); transition: opacity .3s, transform .3s; pointer-events: none; z-index: 400; }
.toast.show { opacity: 1; transform: translateY(0); }

@media (max-width: 760px) {
  /* The toolbar previously relied on horizontal scroll with a hidden
     scrollbar, which meant the view/board toggles could be scrolled
     off-screen with no visual cue that more controls existed. On
     narrow screens it wraps onto multiple lines instead. This is now
     safe with no special-casing needed: the whole header+team+toolbar+
     presence stack lives in one sticky wrapper (.app-topbar), so a
     taller wrapped toolbar just makes that wrapper taller — nothing
     below it can ever be overlapped, and nothing above it needs to
     stop being sticky. */
  .toolbar { flex-wrap: wrap; height: auto; padding: .5rem .75rem; row-gap: .4rem; }
  .toolbar-spacer { display: none; }
  .toggle-group { flex-wrap: wrap; }
  .matrix-wrap { flex-direction: column; }
  .matrix-axis-y { display: none; }
  .matrix-grid { grid-template-columns: 1fr; grid-template-rows: none; min-height: auto; }
  .app-shell { flex-direction: column; }
  .scratch-sidebar-col { max-width: none; min-width: 0; width: 100%; flex: 1 1 auto; }
}

@media (max-width: 600px) {
  .main { padding: .8rem .75rem 5rem; }
  .brand-title { font-size: 1.05rem; }
  .brand-sub { font-size: .5rem; letter-spacing: .1em; }
}
</style>
</head>
<body>

<!-- Login -->
<div id="loginScreen">
  <div style="display:flex;flex-direction:column;align-items:center;gap:.3rem">
    <div class="login-title">Studio Board</div>
    <div class="login-sub">Daily Room Planning</div>
  </div>
  <div class="login-divider"></div>
  <div class="login-prompt">Sign in to continue</div>
  <button class="btn-google" id="btnGoogleSignIn">
    <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
    Sign in with Google
  </button>
</div>

<!-- Loading -->
<div id="loadingScreen">
  <div class="loading-title">Studio Board</div>
  <div class="loading-bar"><div class="loading-bar-inner"></div></div>
</div>

<!-- Everything below sticks together as one unit -->
<div class="app-topbar">
<!-- Header -->
<header>
  <div class="brand">
    <div class="brand-title">🛋️ Studio Board</div>
  </div>
  <div class="header-right">
    <span class="sync-dot" id="syncDot"></span>
    <div class="avatar-menu-wrap">
      <button class="avatar-btn" id="avatarBtn" onclick="toggleAvatarMenu()">
        <span id="userAvatarWrap"></span>
      </button>
      <div class="avatar-dropdown" id="avatarDropdown">
        <div class="avatar-dropdown-name" id="avatarDropdownName"></div>
        <button class="avatar-dropdown-item" onclick="signOutUser()">Sign out</button>
      </div>
    </div>
  </div>
</header>

<!-- Team bar -->
<div class="team-bar">
  <div class="team-info-group">
    <div class="team-switcher">
      <button class="team-switch-btn" onclick="toggleTeamMenu()">
        <span id="teamNameLabel">Loading…</span><span class="team-chevron">▾</span>
      </button>
      <div class="team-menu" id="teamMenu">
        <div class="team-menu-label">Your Teams</div>
        <div class="team-menu-list" id="teamMenuList"></div>
        <div class="team-menu-divider"></div>
        <button class="team-menu-item" onclick="openCreateTeamModal()">＋ New Team</button>
        <button class="team-menu-item" onclick="openJoinTeamModal()">🔗 Join a Team</button>
        <button class="team-menu-item" onclick="openTeamSettingsModal()">⚙ Board Settings</button>
      </div>
    </div>
    <div class="team-members-strip" id="teamMembersStrip"></div>
    <div class="team-desc" id="teamDescLabel"></div>
  </div>
  <div class="presence-group">
    <span class="presence-label">In the app</span>
    <div class="presence-list" id="presenceList"></div>
  </div>
</div>

<!-- Toolbar -->
<div class="toolbar">
  <button class="week-nav-btn" onclick="shiftWeek(-1)" title="Previous week">‹</button>
  <div class="week-label" id="weekLabel"></div>
  <button class="week-nav-btn" onclick="shiftWeek(1)" title="Next week">›</button>
  <button class="today-jump" id="todayJumpBtn" onclick="jumpToToday()">Today</button>
  <div class="toolbar-spacer"></div>
  <div class="toggle-group">
    <span class="toggle-cap">Board</span>
    <div class="scope-toggle">
      <button class="spill active" id="scopeTeamBtn" onclick="setScope('team')" title="Everyone's public goals">Team Board</button>
      <button class="spill" id="scopeMineBtn" onclick="setScope('mine')" title="Just your goals, same days">My Board</button>
    </div>
  </div>
  <div class="toggle-divider"></div>
  <div class="toggle-group">
    <span class="toggle-cap">View</span>
    <div class="view-toggle">
      <button class="vpill active" id="viewTodayBtn" onclick="setView('today')">Day</button>
      <button class="vpill" id="viewWeekBtn" onclick="setView('week')">Week</button>
      <button class="vpill" id="viewMatrixBtn" onclick="setView('matrix')" style="display:none" title="Only available on My Board">Matrix</button>
    </div>
  </div>
</div>

</div><!-- /.app-topbar -->

<main class="main">
  <div class="app-shell">
    <div class="scratch-sidebar-col">
      <div class="quick-add-box">
        <div class="quick-add-label">➕ Quick Add</div>
        <div class="add-goal-row">
          <input class="add-goal-input" id="quickAddInput" placeholder="Add a goal for today…" onkeydown="quickAddKeydown(event)"/>
          <button class="add-goal-btn" onclick="quickAddGoal()">Add</button>
        </div>
      </div>
      <div class="scratch-sidebar" id="scratchSidebar"></div>
    </div>
    <div id="board" class="board-content"></div>
  </div>
</main>

<!-- Generic modal (create/join team, board settings) -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn btn-save" id="modalSaveBtn">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp }   from "https://www.gstatic.com/firebasejs/11.8.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut as fbSignOut }
                           from "https://www.gstatic.com/firebasejs/11.8.0/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs, onSnapshot, addDoc, updateDoc,
         deleteDoc, setDoc, serverTimestamp, arrayUnion, arrayRemove, query, where }
                           from "https://www.gstatic.com/firebasejs/11.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey:            "AIzaSyAKulZ1Z5rklbYR4DPKGsqRyq9DWUCI0ms",
  authDomain:        "etask-1d4f2.firebaseapp.com",
  projectId:         "etask-1d4f2",
  storageBucket:     "etask-1d4f2.firebasestorage.app",
  messagingSenderId: "634781794809",
  appId:             "1:634781794809:web:e779543498e891bee17d28"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);
const provider = new GoogleAuthProvider();

const DEFAULT_TEAM_ID = 'default-team';

let currentUser   = null;
let users         = {};       // uid -> {displayName, photoURL, lastSeen}
let goals         = [];       // all loaded goals across all teams (client filters by currentTeamId)
let teams         = {};       // teamId -> {name, description, memberUids, ownerUid}
let goalsUnsub    = null;
let usersUnsub    = null;
let teamsUnsub    = null;
let currentView   = 'today';  // 'today' | 'week'
let scopeFilter   = 'team';   // 'team' (everyone's public goals) | 'mine' (just current user)
let currentTeamId = DEFAULT_TEAM_ID;
let editingGoalId = null;     // id of the goal currently showing its inline edit panel
// Which day-groups in the Completed panel are expanded. Today's group
// starts open, every other day starts collapsed — this Set just tracks
// which day-keys (ymd strings) have been toggled open during the session.
let completedExpandedDays = new Set([todayStr()]);
let scratchBoards = [{ id: 'm0', title: 'Untitled Board', lines: [{ id: 'l0', text: '', converted: false }] }]; // Untitled Board — multiple named meeting blocks per user
let inlineEditingTextId = null; // goal id whose text is being edited inline, directly on the tile
let selectedQuadrant = null;  // {effort, reward} — click a Matrix quadrant to select it
let quadComposeActive = false; // true once you've started typing a new goal into the selected quadrant
let notesUnsub = null;
let notesSaveTimer = null;
let weekOffset    = 0;        // 0 = this week, -1 = last week, +1 = next week
let selectedDate  = null;     // used in today view; snaps to nearest weekday, set after helpers are defined

// ── DATE HELPERS ──────────────────────────────────────────
// NOTE: dates are always formatted from local Y/M/D components (never via
// toISOString, which converts to UTC and can silently shift the date
// backward or forward depending on the browser's timezone offset).
function ymd(d) { const y=d.getFullYear(); const m=String(d.getMonth()+1).padStart(2,'0'); const dd=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${dd}`; }
function todayStr() { return ymd(new Date()); }
function parseYmd(s) { const [y,m,dd] = s.split('-').map(Number); return new Date(y, m-1, dd); }
function addDays(dateStr, n) { const d = parseYmd(dateStr); d.setDate(d.getDate()+n); return ymd(d); }
function dayOfWeek(dateStr) { return parseYmd(dateStr).getDay(); } // 0 Sun..6 Sat
function isWeekend(dateStr) { const w = dayOfWeek(dateStr); return w === 0 || w === 6; }
function nextWeekday(dateStr) { let d = addDays(dateStr, 1); while (isWeekend(d)) d = addDays(d, 1); return d; }
function mondayOf(dateStr) { const w = dayOfWeek(dateStr); const diff = w === 0 ? -6 : 1 - w; return addDays(dateStr, diff); }
const DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function fmtLong(dateStr) { const d = parseYmd(dateStr); return `${DAY_NAMES[d.getDay()]}, ${MONTHS[d.getMonth()]} ${d.getDate()}`; }
function fmtShort(dateStr) { const d = parseYmd(dateStr); return `${MONTHS[d.getMonth()].slice(0,3)} ${d.getDate()}`; }
function article(label) { return /^[aeiou]/i.test(label) ? 'an' : 'a'; }

function currentWeekMonday() {
  const base = addDays(todayStr(), weekOffset * 7);
  return mondayOf(base); // always Mon..Fri regardless of what today's weekday is
}
function weekDates() {
  const mon = currentWeekMonday();
  return [0,1,2,3,4].map(i => addDays(mon, i));
}
// How many weeks away (relative to weekOffset 0 = this week) a given date's
// week is. Used so that moving a goal's date always jumps the Day/Week view
// to wherever it landed — otherwise a date change outside the currently
// displayed week updates Firestore correctly but looks like nothing happened,
// since the goal just vanishes from view instead of visibly landing anywhere.
function weekOffsetForDate(dateStr) {
  const baseMonday = mondayOf(todayStr());
  const targetMonday = mondayOf(dateStr);
  const days = Math.round((parseYmd(targetMonday) - parseYmd(baseMonday)) / 86400000);
  return Math.round(days / 7);
}

selectedDate = isWeekend(todayStr()) ? nextWeekday(todayStr()) : todayStr();

// ── AUTH ──────────────────────────────────────────────────
document.getElementById('btnGoogleSignIn').onclick = async () => {
  try { await signInWithPopup(auth, provider); }
  catch(e) { showToast('Sign-in failed'); console.error(e); }
};
window.signOutUser = async () => {
  if (goalsUnsub) { goalsUnsub(); goalsUnsub = null; }
  if (usersUnsub) { usersUnsub(); usersUnsub = null; }
  if (teamsUnsub) { teamsUnsub(); teamsUnsub = null; }
  if (notesUnsub) { notesUnsub(); notesUnsub = null; }
  if (publicBoardsUnsub) { publicBoardsUnsub(); publicBoardsUnsub = null; }
  stopHeartbeat();
  await fbSignOut(auth);
};

onAuthStateChanged(auth, async user => {
  if (user) {
    currentUser = user;
    document.getElementById('loginScreen').classList.add('hidden');
    setTimeout(() => document.getElementById('loginScreen').style.display = 'none', 420);
    renderHeaderUser(user);
    await setDoc(doc(db, 'users', user.uid), {
      displayName: user.displayName || user.email,
      email: user.email,
      photoURL: user.photoURL || '',
      lastSeen: serverTimestamp()
    }, { merge: true });
    currentTeamId = localStorage.getItem(`sb_team_${user.uid}`) || DEFAULT_TEAM_ID;
    scopeFilter = localStorage.getItem(`sb_scope_${user.uid}`) || 'team';
    currentView = localStorage.getItem(`sb_view_${user.uid}`) || 'today';
    if (currentView === 'matrix' && scopeFilter !== 'mine') currentView = 'today'; // guard against a stale/invalid combo
    document.getElementById('scopeTeamBtn').classList.toggle('active', scopeFilter === 'team');
    document.getElementById('scopeMineBtn').classList.toggle('active', scopeFilter === 'mine');
    document.body.classList.toggle('scope-mine', scopeFilter === 'mine');
    document.getElementById('viewMatrixBtn').style.display = scopeFilter === 'mine' ? '' : 'none';
    document.getElementById('viewTodayBtn').classList.toggle('active', currentView === 'today');
    document.getElementById('viewWeekBtn').classList.toggle('active', currentView === 'week');
    document.getElementById('viewMatrixBtn').classList.toggle('active', currentView === 'matrix');
    await ensureDefaultTeamMembership();
    await acceptPendingInvites();
    subscribeToUsers();
    subscribeToTeams();
    subscribeToGoals();
    subscribeToNotes();
    subscribeToPublicBoards();
    setSyncState('loading');
    startHeartbeat();
  } else {
    currentUser = null;
    const ls = document.getElementById('loginScreen');
    ls.style.display = ''; ls.classList.remove('hidden');
    document.getElementById('userAvatarWrap').innerHTML = '';
    hideLoading();
  }
});

async function ensureDefaultTeamMembership() {
  try {
    const ref = doc(db, 'teams', DEFAULT_TEAM_ID);
    const snap = await getDoc(ref);
    if (!snap.exists()) {
      await setDoc(ref, {
        name: 'Room Planning Team',
        description: 'The original shared studio board',
        memberUids: [currentUser.uid],
        ownerUid: currentUser.uid,
        createdAt: serverTimestamp()
      });
    } else if (!(snap.data().memberUids || []).includes(currentUser.uid)) {
      await updateDoc(ref, { memberUids: arrayUnion(currentUser.uid) });
    }
  } catch (e) { console.error('ensureDefaultTeamMembership failed', e); }
}

// ── INVITES ───────────────────────────────────────────────
// There's no email-sending backend here — an "invite" just leaves a
// pending record matched on email. If that person later signs in with
// Google using that same email address, they're auto-added to the team
// on load. The inviter still has to tell them to go sign in; nothing
// gets emailed or pushed to them automatically.
async function acceptPendingInvites() {
  try {
    const q = query(collection(db, 'invites'), where('email', '==', (currentUser.email || '').toLowerCase()), where('status', '==', 'pending'));
    const snap = await getDocs(q);
    if (snap.empty) return;
    let joined = 0;
    for (const d of snap.docs) {
      const inv = d.data();
      await updateDoc(doc(db, 'teams', inv.teamId), { memberUids: arrayUnion(currentUser.uid) });
      await updateDoc(doc(db, 'invites', d.id), { status: 'accepted', acceptedAt: serverTimestamp() });
      joined++;
    }
    if (joined) showToast(`Joined ${joined} team${joined > 1 ? 's' : ''} via invite`);
  } catch (e) { console.error('acceptPendingInvites failed', e); }
}

function addableUserOptionsHTML(currentMemberUids) {
  const options = Object.entries(users)
    .filter(([uid]) => !currentMemberUids.includes(uid))
    .sort((a,b) => (userName(a[0])||'').localeCompare(userName(b[0])||''))
    .map(([uid,u]) => `<option value="${uid}">${esc(u.displayName || u.email || 'Someone')}</option>`)
    .join('');
  return options || '<option value="">No other known users</option>';
}

window.addMemberDirectly = async function(teamId) {
  const uid = document.getElementById('addMemberSelect').value;
  if (!uid) { showToast('No user selected'); return; }
  await updateDoc(doc(db, 'teams', teamId), { memberUids: arrayUnion(uid) });
  showToast(`Added ${userName(uid)} to the team`);
  openTeamSettingsModal(); // re-render the modal with the updated member list
};

window.removeMember = async function(teamId, uid) {
  const t = teams[teamId];
  if (!t || t.ownerUid !== (currentUser && currentUser.uid)) { showToast('Only the team owner can remove members'); return; }
  if (uid === t.ownerUid) { showToast("Can't remove the owner"); return; }
  if (!confirm(`Remove ${userName(uid)} from "${t.name}"?`)) return;
  await updateDoc(doc(db, 'teams', teamId), { memberUids: arrayRemove(uid) });
  showToast(`Removed ${userName(uid)}`);
  openTeamSettingsModal(); // re-render the modal with the updated member list
};

window.sendInvite = async function(teamId) {
  const input = document.getElementById('inviteEmailInput');
  const email = (input.value || '').trim().toLowerCase();
  if (!email || !email.includes('@')) { showToast('Enter a valid email'); return; }
  await addDoc(collection(db, 'invites'), {
    teamId, email,
    invitedBy: currentUser.uid,
    invitedByName: currentUser.displayName || currentUser.email,
    status: 'pending',
    createdAt: serverTimestamp()
  });
  input.value = '';
  showToast(`Invite recorded for ${email} — have them sign in to join`);
  refreshPendingInvitesList(teamId);
};

async function refreshPendingInvitesList(teamId) {
  const el = document.getElementById('pendingInvitesList');
  if (!el) return;
  try {
    const q = query(collection(db, 'invites'), where('teamId', '==', teamId), where('status', '==', 'pending'));
    const snap = await getDocs(q);
    el.innerHTML = snap.empty
      ? '<div style="font-size:.7rem;color:var(--muted);font-style:italic">No pending invites</div>'
      : snap.docs.map(d => `<div style="font-size:.74rem;padding:.15rem 0">${esc(d.data().email)} <span style="color:var(--muted)">— pending</span></div>`).join('');
  } catch (e) {
    el.innerHTML = '<div style="font-size:.7rem;color:var(--muted);font-style:italic">Couldn\'t load invites</div>';
  }
}

// ── PRESENCE ──────────────────────────────────────────────
const ONLINE_WINDOW_MS = 90000;
let heartbeatTimer = null;
let presenceTickTimer = null;
function startHeartbeat() {
  touchLastSeen();
  heartbeatTimer = setInterval(touchLastSeen, 25000);
  presenceTickTimer = setInterval(renderPresence, 15000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) touchLastSeen(); });
}
function stopHeartbeat() {
  if (heartbeatTimer) clearInterval(heartbeatTimer);
  if (presenceTickTimer) clearInterval(presenceTickTimer);
  heartbeatTimer = null; presenceTickTimer = null;
}
async function touchLastSeen() {
  if (!currentUser) return;
  try { await setDoc(doc(db, 'users', currentUser.uid), { lastSeen: serverTimestamp() }, { merge: true }); }
  catch (e) { console.error('heartbeat failed', e); }
}
function isOnline(u) {
  if (!u || !u.lastSeen) return false;
  const t = u.lastSeen.toDate ? u.lastSeen.toDate() : new Date(u.lastSeen);
  return (Date.now() - t.getTime()) < ONLINE_WINDOW_MS;
}
function renderPresence() {
  const list = document.getElementById('presenceList');
  if (!list) return;
  const online = Object.entries(users).filter(([uid, u]) => isOnline(u));
  if (!online.length) { list.innerHTML = '<span class="presence-empty">No one else online</span>'; return; }
  list.innerHTML = online.map(([uid, u]) => `
    <span class="presence-chip">
      <span class="presence-dot"></span>
      <span class="presence-name">${esc(u.displayName || u.email || 'Someone')}</span>
    </span>
  `).join('');
}

function renderHeaderUser(user) {
  const wrap = document.getElementById('userAvatarWrap');
  if (user.photoURL) {
    wrap.innerHTML = `<img class="user-avatar" src="${esc(user.photoURL)}" alt="${esc(user.displayName||'')}"/>`;
  } else {
    const i = (user.displayName||user.email||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
    wrap.innerHTML = `<div class="user-avatar-initials">${i}</div>`;
  }
  document.getElementById('avatarDropdownName').innerHTML =
    `${esc(user.displayName || 'Signed in')}<span class="avatar-dropdown-email">${esc(user.email||'')}</span>`;
}

window.toggleAvatarMenu = function() {
  document.getElementById('avatarDropdown').classList.toggle('open');
};
document.addEventListener('click', e => {
  const wrap = document.querySelector('.avatar-menu-wrap');
  if (wrap && !wrap.contains(e.target)) document.getElementById('avatarDropdown').classList.remove('open');
  const tw = document.querySelector('.team-switcher');
  if (tw && !tw.contains(e.target)) document.getElementById('teamMenu').classList.remove('open');
  // Close any open inline dropdown (goal edit form's Owner/Team pickers) if
  // the click landed outside its own wrapper.
  document.querySelectorAll('.inline-dd-wrap').forEach(wrap => {
    if (!wrap.contains(e.target)) {
      const menu = wrap.querySelector('.inline-dd-menu');
      if (menu) menu.classList.remove('open');
    }
  });
  // Clicking outside every quadrant deselects the Matrix's type-to-add target
  if (selectedQuadrant && currentView === 'matrix' && !e.target.closest('.matrix-quad')) {
    selectedQuadrant = null;
    quadComposeActive = false;
    render();
  }
});

// ── USERS ─────────────────────────────────────────────────
function subscribeToUsers() {
  if (usersUnsub) usersUnsub();
  usersUnsub = onSnapshot(collection(db, 'users'), snap => {
    users = {};
    snap.forEach(d => users[d.id] = d.data());
    renderPresence();
    render();
  });
}
function userName(uid) { return (users[uid] && (users[uid].displayName || users[uid].email)) || 'Someone'; }
function avatarHTML(uid) {
  const u = users[uid];
  if (u && u.photoURL) return `<img class="owner-avatar" src="${esc(u.photoURL)}" alt=""/>`;
  const initials = (userName(uid)||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  return `<div class="owner-avatar-init">${initials}</div>`;
}

// ── TEAMS ─────────────────────────────────────────────────
function subscribeToTeams() {
  if (teamsUnsub) teamsUnsub();
  teamsUnsub = onSnapshot(collection(db, 'teams'), snap => {
    teams = {};
    snap.forEach(d => teams[d.id] = d.data());
    // If we somehow ended up on a team we're no longer a member of, fall back.
    const mine = myTeamEntries();
    if (!mine.find(([id]) => id === currentTeamId)) {
      currentTeamId = mine.length ? mine[0][0] : DEFAULT_TEAM_ID;
    }
    renderTeamBar();
    render();
  }, err => {
    console.error('teams subscription failed (check Firestore rules for /teams):', err);
  });
}
function myTeamEntries() {
  const uid = currentUser && currentUser.uid;
  return Object.entries(teams).filter(([, t]) => (t.memberUids || []).includes(uid));
}
function teamName(teamId) {
  const id = teamId || DEFAULT_TEAM_ID;
  return (teams[id] && teams[id].name) || 'Room Planning Team';
}
function renderTeamBar() {
  const t = teams[currentTeamId];
  document.getElementById('teamNameLabel').textContent = t ? t.name : 'Room Planning Team';
  document.getElementById('teamDescLabel').textContent = t && t.description ? t.description : '';
  const memberUids = (t && t.memberUids) || [];
  const stripEl = document.getElementById('teamMembersStrip');
  stripEl.innerHTML = memberUids.slice(0, 6).map(uid => `<span title="${esc(userName(uid))}">${avatarHTML(uid)}</span>`).join('')
    + (memberUids.length > 6 ? `<span class="member-more">+${memberUids.length - 6}</span>` : '');
  const listEl = document.getElementById('teamMenuList');
  const mine = myTeamEntries();
  listEl.innerHTML = mine.length
    ? mine.map(([id, team]) => `
        <button class="team-menu-team ${id===currentTeamId?'active':''}" onclick="switchTeam('${id}')">
          ${esc(team.name)} <span style="color:var(--muted);font-weight:400">· ${(team.memberUids||[]).length} member${(team.memberUids||[]).length===1?'':'s'}</span>
        </button>
      `).join('')
    : `<div style="padding:.5rem .8rem;font-size:.72rem;color:var(--muted);font-style:italic">No teams yet</div>`;
}
window.toggleTeamMenu = function() {
  document.getElementById('teamMenu').classList.toggle('open');
};
window.switchTeam = function(id) {
  currentTeamId = id;
  if (currentUser) localStorage.setItem(`sb_team_${currentUser.uid}`, id);
  document.getElementById('teamMenu').classList.remove('open');
  renderTeamBar();
  render();
};

// ── GENERIC MODAL ─────────────────────────────────────────
function openModal(title, bodyHTML, onSave) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHTML;
  const saveBtn = document.getElementById('modalSaveBtn');
  saveBtn.onclick = async () => { await onSave(); };
  document.getElementById('modalOverlay').classList.add('open');
}
window.closeModal = function() { document.getElementById('modalOverlay').classList.remove('open'); };

window.openCreateTeamModal = function() {
  document.getElementById('teamMenu').classList.remove('open');
  openModal('New Team Board', `
    <div class="form-row"><label>Team Name</label><input id="newTeamName" type="text" placeholder="e.g. Downtown Showroom"/></div>
    <div class="form-row"><label>Description</label><textarea id="newTeamDesc" placeholder="What this board is for"></textarea></div>
  `, async () => {
    const name = document.getElementById('newTeamName').value.trim();
    const description = document.getElementById('newTeamDesc').value.trim();
    if (!name) { showToast('Give the team a name'); return; }
    const ref = await addDoc(collection(db, 'teams'), {
      name, description, memberUids: [currentUser.uid], ownerUid: currentUser.uid, createdAt: serverTimestamp()
    });
    closeModal();
    switchTeam(ref.id);
    showToast(`Created "${name}"`);
  });
};

window.openJoinTeamModal = function() {
  document.getElementById('teamMenu').classList.remove('open');
  openModal('Join a Team', `
    <div class="form-row"><label>Team ID</label><input id="joinTeamId" type="text" placeholder="Paste the Team ID you were given"/></div>
    <div class="form-note">Ask a teammate to open Board Settings on the team you want — it shows the Team ID to share.</div>
  `, async () => {
    const id = document.getElementById('joinTeamId').value.trim();
    if (!id) { showToast('Paste a Team ID'); return; }
    const ref = doc(db, 'teams', id);
    const snap = await getDoc(ref);
    if (!snap.exists()) { showToast('No team found with that ID'); return; }
    await updateDoc(ref, { memberUids: arrayUnion(currentUser.uid) });
    closeModal();
    switchTeam(id);
    showToast(`Joined "${snap.data().name}"`);
  });
};

window.openTeamSettingsModal = function() {
  document.getElementById('teamMenu').classList.remove('open');
  const t = teams[currentTeamId] || { name: '', description: '', memberUids: [] };
  const isAdmin = currentUser && t.ownerUid === currentUser.uid;
  const membersHTML = (t.memberUids || []).map(uid => `
    <div style="display:flex;align-items:center;gap:.45rem;padding:.2rem 0">
      ${avatarHTML(uid)}<span style="font-size:.8rem;flex:1;min-width:0">${esc(userName(uid))}</span>
      ${uid === t.ownerUid ? '<span style="font-size:.58rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em">owner</span>' :
        (isAdmin ? `<button class="note-del-btn" onclick="removeMember('${currentTeamId}','${uid}')" title="Remove from team">✕</button>` : '')}
    </div>
  `).join('') || '<div style="font-size:.72rem;color:var(--muted)">No members</div>';

  openModal('Board Settings', `
    <div class="form-row"><label>Team Name</label><input id="editTeamName" type="text" value="${esc(t.name)}"/></div>
    <div class="form-row"><label>Description</label><textarea id="editTeamDesc">${esc(t.description||'')}</textarea></div>
    <div class="form-row"><label>Members (${(t.memberUids||[]).length})</label>${membersHTML}</div>
    <div class="form-row">

// ── SCRATCHBOARD ───────────────────────────────────────────
// A free-form scratchpad, not tied to any one view — multiple named,
// color-coded boards per user (personal, not per team — same spirit as
// My Board). Each board has a title, an editable color, and its own
// ordered list of lines; each line can carry a "converted to a goal"
// state. Edits save with a short debounce rather than on every keystroke.
function genId(prefix) { return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

// Auto-assigned, but editable afterward — cycles through this palette so
// consecutive boards don't repeat until you've made more than there are colors.
const BOARD_COLORS = ['#c0571a', '#2a7a4a', '#3d6b8a', '#8a4a8a', '#b08a2a', '#4a6b3d', '#a0334f', '#5a4a8a'];
function nextBoardColor() { return BOARD_COLORS[scratchBoards.length % BOARD_COLORS.length]; }

function defaultBoard() { return { id: genId('m'), title: 'Untitled Board', color: nextBoardColor(), public: false, completed: false, completedAt: null, lines: [{ id: genId('l'), text: '', converted: false }] }; }

function subscribeToNotes() {
  if (notesUnsub) notesUnsub();
  notesUnsub = onSnapshot(doc(db, 'notes', currentUser.uid), snap => {
    const data = snap.exists() ? snap.data() : null;
    if (data && Array.isArray(data.boards) && data.boards.length) {
      scratchBoards = data.boards;
    } else if (data && Array.isArray(data.meetings) && data.meetings.length) {
      // Migrate last version's "meetings" field into the renamed "boards" field.
      scratchBoards = data.meetings.map((m, i) => ({ color: BOARD_COLORS[i % BOARD_COLORS.length], ...m }));
    } else if (data && Array.isArray(data.lines) && data.lines.length) {
      // Migrate the original single-notepad format into one board.
      scratchBoards = [{ id: genId('m'), title: 'Untitled Board', color: BOARD_COLORS[0], lines: data.lines }];
    } else if (!scratchBoards.length) {
      scratchBoards = [defaultBoard()];
    }
    // Backfill color and visibility for any board that predates these fields.
    // Public defaults to false no matter what — never silently expose old boards.
    scratchBoards.forEach((b, i) => {
      if (!b.color) b.color = BOARD_COLORS[i % BOARD_COLORS.length];
      if (typeof b.public !== 'boolean') b.public = false;
      if (typeof b.completed !== 'boolean') b.completed = false;
      if (b.completedAt === undefined) b.completedAt = null;
    });
    render();
  }, err => console.error('notes subscription failed (check Firestore rules for /notes):', err));
}

function scheduleNotesSave() {
  clearTimeout(notesSaveTimer);
  notesSaveTimer = setTimeout(async () => {
    try {
      await setDoc(doc(db, 'notes', currentUser.uid), { boards: scratchBoards, updatedAt: serverTimestamp() }, { merge: true });
      await syncPublicBoardsMirror();
    } catch (e) { console.error('notes save failed', e); }
  }, 500);
}

// Boards marked "public" get mirrored into a separate collection (one doc
// per owner) so teammates can see them without opening up the private
// /notes doc itself. Anyone sharing a team with you can read this doc;
// it only ever contains the boards you've explicitly flagged public.
async function syncPublicBoardsMirror() {
  if (!currentUser) return;
  const publicOnes = scratchBoards.filter(b => b.public && !b.completed);
  const ref = doc(db, 'publicBoards', currentUser.uid);
  try {
    if (publicOnes.length) {
      await setDoc(ref, {
        ownerUid: currentUser.uid,
        ownerName: currentUser.displayName || currentUser.email || 'Someone',
        boards: publicOnes,
        updatedAt: serverTimestamp()
      });
    } else {
      await deleteDoc(ref).catch(() => {});
    }
  } catch (e) { console.error('publicBoards mirror sync failed (check Firestore rules for /publicBoards):', e); }
}

window.toggleBoardVisibility = function(boardId) {

  if (!b) return;

// Completing a board archives it — it drops out of the active Scratchboard
// list and shows up instead in the Completed panel, grouped by the day it

// ── SHARED (PUBLIC) BOARDS FROM TEAMMATES ──────────────────
// Anyone who shares at least one team with you and has flagged a board
// public shows up here, read-only, alongside your own Scratchboard.
let publicBoardsUnsub = null;
let publicBoardsCache = {}; // ownerUid -> { ownerName, boards }
function subscribeToPublicBoards() {
  if (publicBoardsUnsub) publicBoardsUnsub();
  publicBoardsUnsub = onSnapshot(collection(db, 'publicBoards'), snap => {
    publicBoardsCache = {};
    snap.forEach(d => { publicBoardsCache[d.id] = d.data(); });
    render();
  }, err => console.error('publicBoards subscription failed (check Firestore rules for /publicBoards):', err));
}
function sharesATeamWithMe(otherUid) {
  if (!currentUser || otherUid === currentUser.uid) return false;
  return Object.values(teams).some(t => (t.memberUids || []).includes(currentUser.uid) && (t.memberUids || []).includes(otherUid));
}
function teammatesPublicBoards() {
  const out = [];
  Object.entries(publicBoardsCache).forEach(([ownerUid, entry]) => {
    if (!sharesATeamWithMe(ownerUid)) return;
    (entry.boards || []).forEach(b => out.push({ ownerUid, ownerName: entry.ownerName, board: b }));
  });
  return out;
}

    const idx = m.lines.findIndex(l => l.id === lineId);

    e.preventDefault();

    const focusLine = m.lines[Math.max(0, idx - 1)];
    m.lines.splice(idx, 1);

// Copy a board's contents as a title + bulleted list. We write both a
// text/html version (real <ul><li> markup, so pasting into Gmail, Docs,
// Word, Slack, Notion etc. produces an actual bulleted list) and a
// text/plain fallback (title + "• line", for plain-text targets like a
// terminal or a bare <textarea>) in the same clipboard write — the target
// app picks whichever format it understands.
function boardToClipboardParts(board) {
  const title = (board.title || '').trim() || 'Untitled Board';
  const lines = (board.lines || []).map(l => (l.text || '').trim()).filter(Boolean);
  const plain = lines.length ? `${title}\n${lines.map(t => `• ${t}`).join('\n')}` : title;
  const html = `<div><strong>${esc(title)}</strong>${lines.length ? `<ul>${lines.map(t => `<li>${esc(t)}</li>`).join('')}</ul>` : ''}</div>`;
  return { plain, html };
}
async function copyBoardPartsToClipboard(board) {
  const { plain, html } = boardToClipboardParts(board);
  try {
    if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
      await navigator.clipboard.write([
        new ClipboardItem({
          'text/plain': new Blob([plain], { type: 'text/plain' }),
          'text/html': new Blob([html], { type: 'text/html' })
        })
      ]);
      return true;
    }
    await navigator.clipboard.writeText(plain);
    return true;
  } catch (e) {
    console.error('rich clipboard copy failed, falling back to plain text', e);
    try { await navigator.clipboard.writeText(plain); return true; }
    catch (e2) { console.error('clipboard copy failed', e2); return false; }
  }
}
window.copyBoardToClipboard = async function(boardId) {
  const b = findBoard(boardId);
  if (!b) return;
  const ok = await copyBoardPartsToClipboard(b);
  showToast(ok ? 'Copied to clipboard — pastes as a real bulleted list' : "Couldn't copy — try again");
};
window.copySharedBoardToClipboard = async function(ownerUid, boardId) {
  const entry = publicBoardsCache[ownerUid];
  const b = entry && (entry.boards || []).find(x => x.id === boardId);
  if (!b) return;
  const ok = await copyBoardPartsToClipboard(b);
  showToast(ok ? 'Copied to clipboard — pastes as a real bulleted list' : "Couldn't copy — try again");
};

window.reactivateNoteLine = function(boardId, lineId) {

// The "nifty" bit: turn a note line straight into a goal — either via the
// ➕ button (lands unrated, today) or by dragging the line's handle onto
// any goal slot / quadrant anywhere in the app (lands exactly there
// instead). The goal's subject combines the board's name with the line
// itself. The line stays in the notes, marked done as a record of what
// was actually captured — untick it to bring it back if you want to
// convert it again.
async function createGoalFromNoteLine(boardId, lineId, extra) {
  const m = findBoard(boardId);
  const line = m && m.lines.find(l => l.id === lineId);
  if (!line || !line.text.trim()) { showToast('Nothing to convert'); return false; }
  const title = (m.title || 'Notes').trim() || 'Notes';
  const text = `${title}: ${line.text.trim()}`;
  await addDoc(collection(db, 'goals'), {
    text,
    uid: currentUser.uid, teamId: currentTeamId,
    visibility: 'private', completed: false,
    effort: null, reward: null,
    createdAt: serverTimestamp(), createdAtMs: Date.now(), order: Date.now(),
    ...extra
  });
  line.converted = true;
  scheduleNotesSave();
  render();
  return true;
}

window.convertNoteLineToGoal = async function(boardId, lineId) {
