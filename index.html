  const ok = await createGoalFromNoteLine(boardId, lineId, { date, slot: 'morning' });
  if (ok) showToast('Added as a goal — drag it into a quadrant when ready');
};

// Dragging a note line's handle: carries "note:<boardId>:<lineId>" so drop
// targets can tell it apart from dragging an existing goal (which carries
// just the goal's id). Dropping it moves it to another board (see
// onBoardDrop) or onto a goal slot / quadrant, which converts it in place.
function parseNoteDrag(raw) {
  if (!raw || !raw.startsWith('note:')) return null;
  const [, boardId, lineId] = raw.split(':');
  return { boardId, lineId };
}
window.onNoteLineDragStart = function(e, boardId, lineId) {
  e.dataTransfer.setData('text/plain', `note:${boardId}:${lineId}`);
  e.dataTransfer.effectAllowed = 'move';
  const row = e.currentTarget.closest('.note-line');
  if (row) row.classList.add('dragging');
};
window.onNoteLineDragEnd = function(e) {
  const row = e.currentTarget.closest('.note-line');
  if (row) row.classList.remove('dragging');
};

// Dropping a note line onto another board's line list moves it there.
window.onBoardDragOver = function(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); };
window.onBoardDragLeave = function(e) { e.currentTarget.classList.remove('drag-over'); };
window.onBoardDrop = function(e, targetBoardId) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  const drag = parseNoteDrag(e.dataTransfer.getData('text/plain'));
  if (!drag || drag.boardId === targetBoardId) return;
  const source = findBoard(drag.boardId);
  const target = findBoard(targetBoardId);
  if (!source || !target) return;
  const idx = source.lines.findIndex(l => l.id === drag.lineId);
  if (idx === -1) return;
  const [line] = source.lines.splice(idx, 1);
  if (!source.lines.length) source.lines.push({ id: genId('l'), text: '', converted: false });
  target.lines.push(line);
  render();
  scheduleNotesSave();
  showToast(`Moved to "${target.title || 'Untitled Board'}"`);
};

// ── GOALS ─────────────────────────────────────────────────
function subscribeToGoals() {
  if (goalsUnsub) goalsUnsub();
  goalsUnsub = onSnapshot(collection(db, 'goals'), snap => {
    goals = [];
    snap.forEach(d => goals.push({ id: d.id, ...d.data() }));
    setSyncState('live');
    hideLoading();
    rolloverOverdueGoals();
    render();
  }, err => { console.error(err); setSyncState('error'); });
}

// Two cleanup passes run every time goals load:
//  1) Weekend fix — any goal (complete or not) that ended up dated on a
//     Sat/Sun is invalid in this Mon-Fri-only app and would otherwise be
//     permanently invisible (the UI never renders weekend columns). This
//     mainly catches goals created before a timezone bug in an earlier
//     version was fixed, which could silently shift dates onto a weekend.
//  2) Rollover — any incomplete goal left on a past weekday moves to the
//     next available weekday (today, if today is Mon-Fri and still ahead).
let rollingInFlight = new Set();
async function rolloverOverdueGoals() {
  const today = todayStr();
  const target = isWeekend(today) ? nextWeekday(today) : today;

  const weekendStuck = goals.filter(g => isWeekend(g.date) && !rollingInFlight.has(g.id));
  for (const g of weekendStuck) {
    rollingInFlight.add(g.id);
    try {
      await updateDoc(doc(db, 'goals', g.id), {
        date: nextWeekday(g.date),
        rolled: true,
        rolledFrom: g.rolledFrom || g.date
      });
    } catch (e) { console.error('weekend fix failed', e); }
    finally { rollingInFlight.delete(g.id); }
  }

  const overdue = goals.filter(g => !g.completed && !isWeekend(g.date) && g.date < target && !rollingInFlight.has(g.id));
  for (const g of overdue) {
    rollingInFlight.add(g.id);
    try {
      await updateDoc(doc(db, 'goals', g.id), {
        date: target,
        rolled: true,
        rolledFrom: g.rolledFrom || g.date
      });
    } catch (e) { console.error('rollover failed', e); }
    finally { rollingInFlight.delete(g.id); }
  }
}

function goalsFor(dateStr, slot) {
  const myUid = currentUser && currentUser.uid;
  let list = goals.filter(g => g.date === dateStr && g.slot === slot);
  if (scopeFilter === 'mine') {
    // My Board shows every goal you own, across every team you're in —
    // not just the currently selected team.
    list = list.filter(g => g.uid === myUid);
  } else {
    list = list
      .filter(g => (g.teamId || DEFAULT_TEAM_ID) === currentTeamId)
      .filter(g => g.uid === myUid || g.visibility !== 'private'); // private goals only visible to their owner
  }
  return list.sort((a,b) => (a.order ?? a.createdAtMs ?? 0) - (b.order ?? b.createdAtMs ?? 0));
}

// ── RENDER ────────────────────────────────────────────────
function render() {
  const wd = weekDates(); // always exactly Mon..Fri of the displayed week
  let weekSuffix;
  if (weekOffset === 0) weekSuffix = 'This Week';
  else if (weekOffset === -1) weekSuffix = 'Last Week';
  else if (weekOffset === 1) weekSuffix = 'Next Week';
  else weekSuffix = weekOffset < 0 ? `${-weekOffset} Weeks Ago` : `${weekOffset} Weeks From Now`;
  document.getElementById('weekLabel').textContent =
    `${fmtShort(wd[0])} – ${fmtShort(wd[4])} · ${weekSuffix}`;

  if (currentView === 'today') {
    if (!wd.includes(selectedDate)) selectedDate = (weekOffset === 0 && !isWeekend(todayStr())) ? todayStr() : wd[0];
  }

  // Date navigation doesn't apply to the Matrix view (it spans all future days at once).
  const dateNavRelevant = currentView !== 'matrix';
  document.querySelectorAll('.week-nav-btn').forEach(b => b.style.display = dateNavRelevant ? '' : 'none');
  document.getElementById('weekLabel').style.display = dateNavRelevant ? '' : 'none';
  // "Today" jump button only shows when date-nav is relevant AND you're not already looking at today.
  const atHome = currentView === 'today' && weekOffset === 0 && selectedDate === todayStr();
  document.getElementById('todayJumpBtn').style.display = (dateNavRelevant && !atHome) ? '' : 'none';

  const board = document.getElementById('board');
  document.getElementById('board').classList.toggle('wide', currentView === 'matrix');
  const inMatrix = currentView === 'matrix';
  const banner = scopeFilter === 'mine' && currentView !== 'matrix'
    ? `<div class="scope-banner">🔒 My Board — every goal you own, across all your teams</div>`
    : '';
  // The Completed panel always lives underneath whatever view is showing,
  // as a child of board-content, so it's never off to the side and always
  // matches that view's own width. Matrix already nests it inside
  // matrix-main (to line up with the quadrant boxes specifically), so it
  // isn't added again here for that view.
  const viewHTML = currentView === 'today' ? renderTodayView(selectedDate, wd) + completedPanelBlockHTML()
                  : currentView === 'week'  ? renderWeekView(wd) + completedPanelBlockHTML()
                  : renderMatrixView();

  // render() runs on every Firestore update — yours, anyone else's, or the
  // automatic rollover check — which otherwise wipes out whatever input
  // you're mid-typing in (in the board OR the Scratchboard sidebar, both
  // rebuilt below), since innerHTML destroys and recreates it. Save focus
  // state on the active input beforehand and restore it afterward (matched
  // by id, so it only reapplies to the same field if it still exists).
  const active = document.activeElement;
  const restore = (active && active.id && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA'))
    ? { id: active.id, value: active.value, start: active.selectionStart, end: active.selectionEnd }
    : null;

  board.innerHTML = banner + viewHTML;
  document.getElementById('scratchSidebar').innerHTML = scratchSidebarHTML();
  document.querySelectorAll('.notes-lines textarea').forEach(autoGrowNoteLine);

  if (restore) {
    const el = document.getElementById(restore.id);
    if (el) {
      el.value = restore.value;
      el.focus();
      try { el.setSelectionRange(restore.start, restore.end); } catch (e) { /* not all input types support this */ }
    }
  }
}

function renderTodayView(dateStr, wd) {
  const todayActual = todayStr();
  const dayPicker = `

          <span class="daypill-date">${parseYmd(d).getDate()}</span>

  const viewingPast = dateStr < todayActual;

  return `

}

// Small pill-toggle-group builder shared by every either/or field in the
// edit form. Renders a hidden input holding the current value plus a row
// of pill buttons that set it — each button also fires an optional
// auto-save callback immediately, since the form has no Save button.
// Pill-toggle-group builder. Mandatory groups (slot, visibility) always
// keep exactly one option active. Optional groups (effort, reward) let you
// tap the already-active pill again to clear it back to unset — no
// separate "not set" button needed.
function pillGroupHTML(inputId, options, current, optional, onSelect) {
  const cur = current ?? '';
  return `
    <input type="hidden" id="${inputId}" value="${esc(cur)}" data-optional="${optional ? '1' : '0'}"/>
    <div class="pill-toggle-group">
      ${options.map(o => `<button type="button" class="pill-toggle ${String(o.value)===String(cur)?'active':''}" title="${esc(o.title)}" onclick="setPillValue('${inputId}','${o.value}',this);${onSelect || ''}">${o.label}</button>`).join('')}
    </div>
  `;
}
window.setPillValue = function(inputId, value, btn) {
  const input = document.getElementById(inputId);
  const optional = input.dataset.optional === '1';
  if (optional && btn.classList.contains('active')) {
    input.value = '';
    Array.from(btn.parentElement.children).forEach(b => b.classList.remove('active'));
    return;
  }
  input.value = value;
  Array.from(btn.parentElement.children).forEach(b => b.classList.toggle('active', b === btn));
};

window.autoSaveGoalPriority = async function(id) {

window.autoSaveGoalDate = async function(id, value) {
  if (!value) { showToast('Pick a date'); render(); return; }
  if (value < todayStr()) { showToast('Pick today or a future date — past days are locked'); render(); return; }
  if (isWeekend(value)) { showToast('Pick a weekday — Mon to Fri only'); render(); return; }
  await updateDoc(doc(db, 'goals', id), { date: value, rolled: false });
  // The write itself always succeeds, but if the new date falls in a
  // different week than the one currently on screen, the goal just
  // vanishes from the visible slot with nothing to show it actually
  // moved — so jump the Day/Week nav to wherever it landed.
  weekOffset = weekOffsetForDate(value);
  if (currentView === 'today') selectedDate = value;
  showToast(`Moved to ${fmtShort(value)}`);
  render();
};

// Clicking a goal card anywhere expands/collapses it — except on the parts

// ── DRAG & DROP ──────────────────────────────────────────
// Dropping on a specific goal card reorders within that slot (or moves +
// inserts at that position if coming from elsewhere). Dropping on the
// empty area of a slot appends to the end of that slot.
window.onGoalDragStart = function(e, id) {
  e.dataTransfer.setData('text/plain', id);
  e.dataTransfer.effectAllowed = 'move';
  e.currentTarget.classList.add('dragging');
};
window.onGoalDragEnd = function(e) {
  e.currentTarget.classList.remove('dragging');
};
function isPastDate(dateStr) { return dateStr < todayStr(); }
window.onSlotDragOver = function(e, dateStr) {
  e.preventDefault();
  if (dateStr && isPastDate(dateStr)) {
    e.dataTransfer.dropEffect = 'none';
    e.currentTarget.classList.add('drag-over-blocked');
    return;
  }
  e.currentTarget.classList.add('drag-over');
};
window.onSlotDragLeave = function(e) {
  e.currentTarget.classList.remove('drag-over');
  e.currentTarget.classList.remove('drag-over-blocked');
};
window.onSlotDrop = async function(e, dateStr, slot) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  e.currentTarget.classList.remove('drag-over-blocked');
  if (isPastDate(dateStr)) { showToast("Can't move goals to a past day"); return; }
  const raw = e.dataTransfer.getData('text/plain');
  if (!raw) return;
  const noteDrag = parseNoteDrag(raw);
  if (noteDrag) {
    const ok = await createGoalFromNoteLine(noteDrag.boardId, noteDrag.lineId, { date: dateStr, slot });
    if (ok) showToast(`Added to ${fmtShort(dateStr)} · ${slot}`);
    return;
  }
  const id = raw;
  const g = goals.find(x => x.id === id);
  if (!g || (g.date === dateStr && g.slot === slot)) return;
  const list = goalsFor(dateStr, slot);
  await updateDoc(doc(db, 'goals', id), { date: dateStr, slot, rolled: false, order: (list[list.length-1]?.order ?? 0) + 1 });
  showToast(`Moved to ${fmtShort(dateStr)} · ${slot}`);
};
window.onGoalCardDrop = async function(e, targetId) {
  e.preventDefault();
  e.stopPropagation();
  const raw = e.dataTransfer.getData('text/plain');
  if (!raw || raw === targetId) return;
  const target = goals.find(x => x.id === targetId);
  if (!target) return;
  if (isPastDate(target.date)) { showToast("Can't move goals to a past day"); return; }
  const noteDrag = parseNoteDrag(raw);
  if (noteDrag) {
    const list = goalsFor(target.date, target.slot);
    const ok = await createGoalFromNoteLine(noteDrag.boardId, noteDrag.lineId, { date: target.date, slot: target.slot, order: (list[list.length-1]?.order ?? 0) + 1 });
    if (ok) showToast(`Added to ${fmtShort(target.date)} · ${target.slot}`);
    return;
  }
  const sourceId = raw;
  const source = goals.find(x => x.id === sourceId);
  if (!source) return;
  const sameList = source.date === target.date && source.slot === target.slot;
  let list = goalsFor(target.date, target.slot).filter(x => x.id !== sourceId);
  const idx = list.findIndex(x => x.id === targetId);
  list.splice(idx, 0, source);
  const updates = list.map((g, i) => {
    const patch = { order: i };
    if (g.id === sourceId) {
      patch.date = target.date;
      patch.slot = target.slot;
      if (!sameList) patch.rolled = false;
    }
    return updateDoc(doc(db, 'goals', g.id), patch);
  });
  await Promise.all(updates);
  showToast(sameList ? 'Reordered' : `Moved to ${fmtShort(target.date)} · ${target.slot}`);
};

function renderWeekView(wd) {
  const today = todayStr();
  return `
    <div class="week-grid">
      ${wd.map(d => `
        <div class="day-col ${d===today?'is-today':''} ${d<today?'is-past':''}">
          <div class="day-col-hdr">
            <div class="day-col-name">${DAY_NAMES[parseYmd(d).getDay()]}</div>
            <div class="day-col-date">${fmtShort(d)}</div>
            ${d<today ? '<div class="day-col-locked">🔒 Locked</div>' : ''}
          </div>
          <div class="day-col-body">
            ${weekSlotHTML(d, 'morning', '☕')}
            ${weekSlotHTML(d, 'afternoon', '🛋️')}
          </div>
        </div>

}

function weekSlotHTML(dateStr, slot, icon) {

    <div>

           ondragover="onSlotDragOver(event,'${dateStr}')"
           ondragleave="onSlotDragLeave(event)"

// ── PRIORITY MATRIX ──────────────────────────────────────
// Only meaningful on My Board (it's a personal prioritization tool, not
// a team view). Pulls every incomplete goal you own dated today or later,
// across every team — same "all your goals" philosophy as My Board itself.
// Effort/Reward are each 1 (Low) or 2 (High); dragging a goal onto a
// quadrant sets both fields at once.
function myFutureGoalsForMatrix() {
  const myUid = currentUser && currentUser.uid;
  const today = todayStr();
  return goals.filter(g => g.uid === myUid && !g.completed && g.date >= today);
}
// Same ordering convention as goalsFor() (Day/Week view) — an explicit
// `order` field, falling back to creation time for goals that predate it —
// so each quadrant (and the unrated tray) has a stable, drag-reorderable order.
function matrixListSort(list) {
  return list.slice().sort((a, b) => (a.order ?? a.createdAtMs ?? 0) - (b.order ?? b.createdAtMs ?? 0));
}

function renderMatrixView() {
  const mine = myFutureGoalsForMatrix();
  const unrated = matrixListSort(mine.filter(g => !g.effort || !g.reward));
  const quad = (effort, reward) => matrixListSort(mine.filter(g => g.effort === effort && g.reward === reward));

  return `
    <div class="matrix-intro">Every future goal you own, across every team. Drag a card into a quadrant to set its priority — or use Quick Add on the left.</div>
    <div class="matrix-unrated">
      <div class="matrix-unrated-hdr">
        <span class="matrix-unrated-title">Needs Rating (${unrated.length})</span>
        <div class="matrix-unrated-line"></div>
      </div>
      <div class="matrix-unrated-tray"
           ondragover="onMatrixDragOver(event)" ondragleave="onMatrixDragLeave(event)" ondrop="onMatrixTrayDrop(event)">
        ${unrated.length ? unrated.map(g => matrixGoalHTML(g, null, null)).join('') : `<div class="matrix-unrated-empty">Nothing waiting to be rated</div>`}
      </div>
    </div>
    <div class="matrix-wrap">
      <div class="matrix-axis-y"><span class="axis-arrow">↑</span><span class="axis-word">Reward</span></div>
      <div class="matrix-main">
        <div class="matrix-grid">
          ${matrixQuadHTML('q-lo-hi', 'Showroom Wins', 'Low effort · High reward', quad(1,2))}
          ${matrixQuadHTML('q-hi-hi', 'Signature Pieces', 'High effort · High reward', quad(2,2))}
          ${matrixQuadHTML('q-lo-lo', 'Quick Tidy', 'Low effort · Low reward', quad(1,1))}
          ${matrixQuadHTML('q-hi-lo', 'Back of the Warehouse', 'High effort · Low reward', quad(2,1))}
        </div>
        <div class="matrix-axis-x"><span>Effort →</span></div>
        <div class="completed-panel matrix-completed-panel">${completedPanelHTML()}</div>
      </div>
    </div>
  `;
}

// A plain reference list of every goal you've ever completed, newest
// first — not scoped to a team/date/view, just "everything I've finished".
// Read-only; nothing here is clickable or editable.
// Everything that's been "finished" — completed goals AND completed
// (archived) Scratchboard boards — combined into one dated timeline.
function completedEntries() {
  const myUid = currentUser && currentUser.uid;
  const goalEntries = goals
    .filter(g => g.completed && g.uid === myUid)
    .map(g => ({
      type: 'goal',
      item: g,
      ts: (g.completedAt && g.completedAt.toMillis) ? g.completedAt.toMillis() : (g.createdAtMs || 0)
    }));
  const boardEntries = scratchBoards
    .filter(b => b.completed)
    .map(b => ({ type: 'board', item: b, ts: b.completedAt || 0 }));
  return goalEntries.concat(boardEntries).sort((a, b) => b.ts - a.ts);
}

// Groups the combined list by the local calendar day each entry finished
// on (dayKey = ymd string, or 'unknown' for old completed goals from
// before completedAt existed) — preserves the newest-first order of days
// since entries arrive already sorted newest-first.
function groupCompletedByDay(entries) {
  const order = [];
  const map = new Map();
  entries.forEach(e => {
    const dayKey = e.ts ? ymd(new Date(e.ts)) : 'unknown';
    if (!map.has(dayKey)) { map.set(dayKey, []); order.push(dayKey); }
    map.get(dayKey).push(e);
  });
  return order.map(dayKey => ({ dayKey, entries: map.get(dayKey) }));
}

function dayGroupLabel(dayKey) {
  if (dayKey === 'unknown') return 'Earlier';
  const today = todayStr();
  if (dayKey === today) return 'Today';
  if (dayKey === addDays(today, -1)) return 'Yesterday';
  return `${DAY_NAMES[parseYmd(dayKey).getDay()].slice(0,3)}, ${fmtShort(dayKey)}`;
}

window.toggleCompletedDay = function(dayKey) {
  if (completedExpandedDays.has(dayKey)) completedExpandedDays.delete(dayKey);
  else completedExpandedDays.add(dayKey);
  render();
};

// Day/Week view wrapper — sits underneath the goal list itself (inside
// board-content), matching its width, instead of off in a side column.
function completedPanelBlockHTML() {
  return `<div class="completed-panel board-completed-panel">${completedPanelHTML()}</div>`;
}

function completedPanelHTML() {
  const groups = groupCompletedByDay(completedEntries());
  const totalCount = groups.reduce((n, g) => n + g.entries.length, 0);
  return `
    <div class="notes-hdr">
      <span class="notes-title">✅ Completed <span class="completed-count">${totalCount}</span></span>
    </div>
    <div class="completed-groups">
      ${groups.length ? groups.map(completedDayGroupHTML).join('') : '<div class="completed-empty">Nothing completed yet</div>'}
    </div>
  `;
}
function completedDayGroupHTML(group) {
  const isOpen = completedExpandedDays.has(group.dayKey);
  return `
    <div class="completed-day-group">
      <button type="button" class="completed-day-hdr" onclick="toggleCompletedDay('${group.dayKey}')">
        <span class="completed-day-chevron">${isOpen ? '▾' : '▸'}</span>
        <span class="completed-day-label">${dayGroupLabel(group.dayKey)}</span>
        <span class="completed-count">${group.entries.length}</span>
      </button>
      ${isOpen ? `
        <div class="completed-day-body goal-list">
          ${group.entries.map(e => e.type === 'goal' ? goalCardHTML(e.item) : completedBoardHTML(e.item)).join('')}
        </div>
      ` : ''}
    </div>
  `;
}
// Archived boards keep their lines visible (read-only) plus a way back —
// restore returns it to the active Scratchboard list, or delete it for good.
function completedBoardHTML(b) {
  const color = b.color || '#c0571a';
  const lines = (b.lines || []).filter(l => (l.text || '').trim());
  return `
    <div class="scratch-board completed-board" style="border-left: 4px solid ${color}">
      <div class="scratch-board-hdr">
        <span class="board-color-swatch" style="background:${color};display:inline-block"></span>
        <span class="board-title-input shared-board-title">${esc(b.title || 'Untitled Board')}</span>
        <button class="note-del-btn" onclick="toggleBoardCompleted('${b.id}')" title="Restore to your active Scratchboard">↩</button>
        <button class="note-del-btn" onclick="copyBoardToClipboard('${b.id}')" title="Copy as a title + bullet list">📋</button>
        <button class="note-del-btn" onclick="deleteScratchBoard('${b.id}')" title="Delete permanently">✕</button>
      </div>
      <div class="notes-lines">
        ${lines.length ? lines.map(l => `<div class="note-line shared"><span class="shared-line-text">${esc(l.text)}</span></div>`).join('') : '<div class="matrix-unrated-empty">No lines on this board</div>'}
      </div>
    </div>
  `;
}

// Rendered once per render() call, always — not just in Matrix view — into
// the persistent #scratchSidebar element that sits alongside every view.
function scratchSidebarHTML() {
  return `
      <div class="notes-hdr">
        <span class="notes-title">🗒️ Scratchboard</span>
        <span class="notes-sub">A place for anything — meeting notes, ideas, reminders. Click ➕ on any line to turn it into a goal, named "Board: line text". Boards are private by default — tap 🔒 to share one with your teammates, or 📋 to copy its contents.</span>
      </div>
      <div class="scratch-boards-list">
        ${scratchBoards.filter(b => !b.completed).map(scratchBoardHTML).join('')}
      </div>
      <button class="gact" onclick="addScratchBoard()">＋ Add Board</button>
      ${sharedBoardsSectionHTML()}
  `;
}

// Read-only view of teammates' boards that they've flagged 🌐 public.
function sharedBoardsSectionHTML() {
  const shared = teammatesPublicBoards();
  if (!shared.length) return '';
  return `
    <div class="notes-hdr" style="margin-top:.4rem">
      <span class="notes-title" style="font-size:.9rem">👀 Shared with your teams</span>
    </div>
    <div class="scratch-boards-list">
      ${shared.map(({ownerUid, ownerName, board}) => sharedBoardHTML(ownerUid, ownerName, board)).join('')}
    </div>
  `;
}
function sharedBoardHTML(ownerUid, ownerName, board) {
  const color = board.color || '#c0571a';
  const lines = (board.lines || []).filter(l => (l.text || '').trim());
  return `
    <div class="scratch-board shared-board" style="border-left: 4px solid ${color}">
      <div class="scratch-board-hdr">
        <span class="board-color-swatch" style="background:${color};display:inline-block"></span>
        <span class="board-title-input shared-board-title">${esc(board.title || 'Untitled Board')}</span>
        <button class="note-del-btn" onclick="copySharedBoardToClipboard('${ownerUid}','${board.id}')" title="Copy as a title + bullet list">📋</button>
      </div>
      <div class="shared-board-owner">by ${esc(ownerName || 'Someone')}</div>
      <div class="notes-lines">
        ${lines.length ? lines.map(l => `<div class="note-line shared"><span class="shared-line-text">${esc(l.text)}</span></div>`).join('') : '<div class="matrix-unrated-empty">Nothing on this board yet</div>'}
      </div>
    </div>
  `;
}

function scratchBoardHTML(m) {
  const color = m.color || '#c0571a';
  return `
    <div class="scratch-board" style="border-left: 4px solid ${color}"
         ondragover="onBoardDragOver(event)" ondragleave="onBoardDragLeave(event)" ondrop="onBoardDrop(event,'${m.id}')">
      <div class="scratch-board-hdr">
        <input type="color" class="board-color-swatch" id="board-color-${m.id}" value="${color}"
               title="Change this board's color" onchange="onBoardColorInput('${m.id}', this.value)"/>
        <input type="text" class="board-title-input" id="board-title-${m.id}" value="${esc(m.title)}" placeholder="Board name / topic…"
               oninput="onBoardTitleInput('${m.id}', this.value)"/>
        <button class="board-visibility-btn ${m.public ? 'public' : ''}" onclick="toggleBoardVisibility('${m.id}')"
                title="${m.public ? 'Public to your teammates — click to make private' : 'Private — click to share with your teammates'}">${m.public ? '🌐' : '🔒'}</button>
        <button class="note-del-btn" onclick="toggleBoardCompleted('${m.id}')" title="Mark complete — archives it under Completed">✔</button>
        <button class="note-del-btn" onclick="copyBoardToClipboard('${m.id}')" title="Copy as a title + bullet list">📋</button>
        <button class="note-del-btn" onclick="deleteScratchBoard('${m.id}')" title="Delete this board">✕</button>
      </div>
      <div class="notes-lines">
        ${m.lines.map(l => noteLineHTML(m.id, l)).join('')}
      </div>
      <button class="gact board-add-line" onclick="addNoteLine('${m.id}')">＋ Add line</button>
    </div>
  `;
}

function noteLineHTML(boardId, l) {
  return `
    <div class="note-line ${l.converted ? 'converted' : ''}">
      <span class="note-drag-handle" draggable="true"
            ondragstart="onNoteLineDragStart(event,'${boardId}','${l.id}')" ondragend="onNoteLineDragEnd(event)"
            title="Drag onto another board, or onto a goal slot / quadrant to convert it there">⠿</span>
      <textarea id="note-${l.id}" rows="1" placeholder="Type a note… (Shift+Enter for a new line within it)"
                oninput="autoGrowNoteLine(this); onNoteLineInput('${boardId}','${l.id}', this.value)"
                onkeydown="onNoteLineKeydown(event,'${boardId}','${l.id}')">${esc(l.text)}</textarea>
      <button class="note-convert-btn" onclick="${l.converted ? `reactivateNoteLine('${boardId}','${l.id}')` : `convertNoteLineToGoal('${boardId}','${l.id}')`}" title="${l.converted ? 'Untick — bring it back as not-yet-converted' : 'Turn into a goal'}">${l.converted ? '✓' : '➕'}</button>
      <button class="note-del-btn" onclick="deleteNoteLine('${boardId}','${l.id}')" title="Delete line">✕</button>
    </div>
  `;
}

// Click a quadrant to select it (visual highlight), then just start
// typing — no need to click into an input first. The first keystroke
// opens a small compose field pre-filled with what you typed; Enter
// submits it as a new goal already rated for that quadrant, and the
// quadrant stays selected so you can keep typing more in a row.
window.selectQuadrant = function(effort, reward, evt) {
  if (evt && evt.target.closest && evt.target.closest('.goal-card')) return; // let card clicks behave normally
  selectedQuadrant = { effort, reward };
  quadComposeActive = false;
  render();
};

document.addEventListener('keydown', e => {
  if (currentView !== 'matrix' || !selectedQuadrant || quadComposeActive) return;
  const activeTag = document.activeElement && document.activeElement.tagName;
  if (activeTag === 'INPUT' || activeTag === 'TEXTAREA' || activeTag === 'SELECT') return; // already typing somewhere else
  if (document.getElementById('modalOverlay').classList.contains('open')) return;
  if (e.key.length !== 1 || e.ctrlKey || e.metaKey || e.altKey) return; // only plain printable characters
  e.preventDefault();
  quadComposeActive = true;
  render();
  const input = document.getElementById('quad-compose-input');
  if (input) { input.value = e.key; input.focus(); input.setSelectionRange(1, 1); }
});

window.onQuadComposeKeydown = function(e, effort, reward) {
  if (e.key === 'Enter') { e.preventDefault(); submitQuadCompose(effort, reward); }
  else if (e.key === 'Escape') { e.preventDefault(); quadComposeActive = false; render(); }
};

window.submitQuadCompose = async function(effort, reward) {
  const input = document.getElementById('quad-compose-input');
  const text = (input ? input.value : '').trim();
  quadComposeActive = false;
  if (!text) { render(); return; }
  const date = isWeekend(todayStr()) ? nextWeekday(todayStr()) : todayStr();
  await addDoc(collection(db, 'goals'), {
    text, date, slot: 'morning',
    uid: currentUser.uid, teamId: currentTeamId,
    visibility: 'private', completed: false,
    effort, reward,
    createdAt: serverTimestamp(), createdAtMs: Date.now(), order: Date.now()
  });
  render();
};

function matrixQuadHTML(cls, title, sub, list) {
  const [effort, reward] = cls === 'q-lo-hi' ? [1,2] : cls === 'q-hi-hi' ? [2,2] : cls === 'q-lo-lo' ? [1,1] : [2,1];
  const isSelected = selectedQuadrant && selectedQuadrant.effort === effort && selectedQuadrant.reward === reward;
  const isComposing = isSelected && quadComposeActive;
  return `
    <div class="matrix-quad ${cls} ${isSelected ? 'selected' : ''}"
         onclick="selectQuadrant(${effort},${reward},event)"
         ondragover="onMatrixDragOver(event)" ondragleave="onMatrixDragLeave(event)" ondrop="onMatrixDrop(event,${effort},${reward})">
      <div class="matrix-quad-title">${title}</div>
      <div class="matrix-quad-sub">${sub}</div>
      ${isComposing ? `
        <div class="quad-compose-row" onclick="event.stopPropagation()">
          <input type="text" id="quad-compose-input" placeholder="Type a goal, press Enter…"
                 onkeydown="onQuadComposeKeydown(event,${effort},${reward})"/>
        </div>
      ` : ''}
      ${list.length ? list.map(g => matrixGoalHTML(g, effort, reward)).join('') : (isComposing ? '' : `<div class="matrix-quad-empty">${isSelected ? 'Selected — just start typing' : 'Drop a goal here'}</div>`)}
    </div>
  `;
}

// Matrix cards reuse the same anatomy as every other goal tile (check,
// owner, ✎ edit / ↻ roll / ✕ delete) so goals act identically everywhere —
// clicking never jumps views. Dropping directly onto a card sets the same
// effort/reward as dropping on the quadrant it's in.
function matrixGoalHTML(g, effort, reward) {
  const editing = g.id === editingGoalId;
  const isPrivate = g.visibility === 'private';
  return `
    <div class="goal-card matrix-goal ${g.completed ? 'completed' : ''} ${isPrivate ? 'is-private' : ''}"
         draggable="true"
         onclick="onGoalCardClick(event,'${g.id}')"
         ondragstart="onGoalDragStart(event,'${g.id}')"
         ondragend="onGoalDragEnd(event)"
         ondragover="event.preventDefault(); event.stopPropagation();"
         ondrop="onMatrixCardDrop(event,${effort===null?'null':effort},${reward===null?'null':reward},'${g.id}')">
      <button class="goal-check" onclick="toggleGoal('${g.id}')">${g.completed ? '✓' : ''}</button>
      <div class="goal-body">
        ${goalTextHTML(g)}
        <div class="goal-meta">
          ${ownerTagHTML(g)}
          ${visibilityTagHTML(g)}
          ${teamTagHTML(g)}
        </div>
        ${editing ? goalEditFormHTML(g) : ''}
      </div>
      <div class="goal-actions">
        <div class="goal-actions-row">
          <button class="gact" onclick="toggleEditGoal('${g.id}')" title="Expand to edit owner, date, slot or visibility">${editing ? '▲' : '▾'}</button>
          <button class="gact roll" onclick="rollGoal('${g.id}')" title="Move to next day">↻</button>
          <button class="gact del" onclick="deleteGoal('${g.id}')" title="Delete">✕</button>
        </div>
        ${g.rolled ? `<span class="rolled-badge">↻ rolled</span>` : ''}
      </div>
    </div>
  `;
}

function matrixDropDate() { return isWeekend(todayStr()) ? nextWeekday(todayStr()) : todayStr(); }

// Dropping directly onto another card reorders within that quadrant (or
// the unrated tray, effort/reward both null) — same splice-and-reindex
// approach as Day view's onGoalCardDrop. Dropping onto a card in a
// *different* quadrant both reorders there and updates effort/reward.
window.onMatrixCardDrop = async function(e, effort, reward, targetId) {
  e.preventDefault();
  e.stopPropagation();
  const raw = e.dataTransfer.getData('text/plain');
  if (!raw || raw === targetId) return;
  const noteDrag = parseNoteDrag(raw);
  if (noteDrag) {
    const list = matrixListSort(myFutureGoalsForMatrix().filter(g => g.effort === effort && g.reward === reward));
    const ok = await createGoalFromNoteLine(noteDrag.boardId, noteDrag.lineId, { date: matrixDropDate(), slot: 'morning', effort, reward, order: (list[list.length-1]?.order ?? 0) + 1 });
    if (ok) showToast(effort === null ? 'Added to Needs Rating' : 'Added with priority set');
    return;
  }
  const sourceId = raw;
  const source = goals.find(x => x.id === sourceId);
  if (!source) return;
  const sameQuad = source.effort === effort && source.reward === reward;
  let list = matrixListSort(myFutureGoalsForMatrix().filter(g => g.effort === effort && g.reward === reward)).filter(x => x.id !== sourceId);
  const idx = list.findIndex(x => x.id === targetId);
  list.splice(idx === -1 ? list.length : idx, 0, source);
  const updates = list.map((g, i) => {
    const patch = { order: i };
    if (g.id === sourceId) { patch.effort = effort; patch.reward = reward; }
    return updateDoc(doc(db, 'goals', g.id), patch);
  });
  await Promise.all(updates);
  showToast(sameQuad ? 'Reordered' : 'Priority updated');
};

window.onMatrixDragOver = function(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); };
window.onMatrixDragLeave = function(e) { e.currentTarget.classList.remove('drag-over'); };
// Dropping on empty quadrant space (not on a specific card) appends to the
// end of that quadrant's order instead of leaving order unset.
window.onMatrixDrop = async function(e, effort, reward) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  const raw = e.dataTransfer.getData('text/plain');
  if (!raw) return;
  const list = matrixListSort(myFutureGoalsForMatrix().filter(g => g.effort === effort && g.reward === reward));
  const noteDrag = parseNoteDrag(raw);
  if (noteDrag) {
    const ok = await createGoalFromNoteLine(noteDrag.boardId, noteDrag.lineId, { date: matrixDropDate(), slot: 'morning', effort, reward, order: (list[list.length-1]?.order ?? 0) + 1 });
    if (ok) showToast('Added with priority set');
    return;
  }
  await updateDoc(doc(db, 'goals', raw), { effort, reward, order: (list[list.length-1]?.order ?? 0) + 1 });
  showToast('Priority updated');
};
window.onMatrixTrayDrop = async function(e) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  const raw = e.dataTransfer.getData('text/plain');
  if (!raw) return;
  const list = matrixListSort(myFutureGoalsForMatrix().filter(g => !g.effort || !g.reward));
  const noteDrag = parseNoteDrag(raw);
  if (noteDrag) {
    const ok = await createGoalFromNoteLine(noteDrag.boardId, noteDrag.lineId, { date: matrixDropDate(), slot: 'morning', effort: null, reward: null, order: (list[list.length-1]?.order ?? 0) + 1 });
    if (ok) showToast('Added to Needs Rating');
    return;
  }
  await updateDoc(doc(db, 'goals', raw), { effort: null, reward: null, order: (list[list.length-1]?.order ?? 0) + 1 });
  showToast('Moved back to unrated');
};

// ── UTIL ──────────────────────────────────────────────────
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function setSyncState(state) { document.getElementById('syncDot').className = `sync-dot ${state}`; }
function hideLoading(){ const ls=document.getElementById('loadingScreen'); ls.classList.add('hidden'); setTimeout(()=>ls.style.display='none',420); }
window.showToast = msg => {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window._toastT);
  window._toastT = setTimeout(()=>t.classList.remove('show'), 2400);
};
</script>

<!-- PWA: register the service worker so the app can install standalone
     and load instantly (from cache) instead of blank-refreshing on
     mobile. Registered plain (non-module) so it runs even if the
     module script above ever fails to load. -->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .catch(err => console.error('Service worker registration failed:', err));
  });
}
</script>
