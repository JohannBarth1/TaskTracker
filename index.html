<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Studio Board — Daily Planning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --cream:        #faf6f0;
  --warm-white:   #fffdf9;
  --ink:          #1a1208;
  --brown:        #6b4c2a;
  --rust:         #c0571a;
  --gold:         #c8952a;
  --light-brown:  #e8d5b7;
  --border:       #d4b896;
  --muted:        #8a7060;
  --panel:        #f2ebe0;
  --danger:       #b03030;
  --success:      #2a7a4a;
  --success-pale: #e8f5ee;
  --header-h:     52px;
  --team-h:       36px;
  --toolbar-h:    50px;
  --presence-h:   30px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Lato', sans-serif;
  background: var(--cream);
  color: var(--ink);
  display: flex; flex-direction: column;
  min-height: 100%;
}

/* ── LOGIN ── */
#loginScreen {
  position: fixed; inset: 0;
  background: var(--ink);
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 1.6rem;
  z-index: 999; transition: opacity .4s;
}
#loginScreen.hidden { opacity: 0; pointer-events: none; }
.login-title { font-family: 'Playfair Display', serif; font-size: 2.8rem; color: var(--light-brown); letter-spacing: -.02em; }
.login-sub { font-size: .62rem; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); }
.login-divider { width: 40px; height: 2px; background: var(--gold); opacity: .4; }
.login-prompt { font-size: .82rem; color: var(--muted); letter-spacing: .04em; }
.btn-google {
  display: flex; align-items: center; gap: .75rem;
  padding: .75rem 1.4rem; background: var(--warm-white);
  border: none; border-radius: 3px; cursor: pointer;
  font-family: 'Lato', sans-serif; font-size: .88rem; font-weight: 700;
  color: var(--ink); letter-spacing: .04em;
  box-shadow: 0 2px 10px rgba(0,0,0,.3);
  transition: background .15s, transform .12s;
}
.btn-google:hover { background: #fff; transform: translateY(-1px); }
.btn-google svg { width: 20px; height: 20px; }

/* ── HEADER ── */
header {
  background: var(--ink); color: var(--cream);
  height: var(--header-h); padding: 0 1rem;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 3px solid var(--gold);
  flex-shrink: 0; position: sticky; top: 0; z-index: 40;
  /* overflow must stay visible — the avatar dropdown is absolutely
     positioned and extends below the header's own box */
}
.brand { display: flex; align-items: baseline; gap: .6rem; white-space: nowrap; flex-shrink: 0; }
.brand-title { font-family: 'Playfair Display', serif; font-size: 1.25rem; color: var(--light-brown); }
.brand-sub { font-size: .58rem; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); }
.header-right { display: flex; align-items: center; gap: .65rem; flex-shrink: 0; }
.user-avatar { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--gold); object-fit: cover; flex-shrink: 0; }
.user-avatar-initials {
  width: 30px; height: 30px; border-radius: 50%;
  border: 2px solid var(--gold); background: var(--brown); color: var(--light-brown);
  font-size: .68rem; font-weight: 700;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: inline-block; transition: background .3s; }
.sync-dot.live { background: var(--success); } .sync-dot.error { background: var(--danger); }
.sync-dot.loading { background: var(--gold); animation: pulse .8s infinite; }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:.3} }

/* ── AVATAR DROPDOWN ── */
.avatar-menu-wrap { position: relative; }
.avatar-btn { background: none; border: none; cursor: pointer; padding: 0; display: flex; }
.avatar-dropdown {
  display: none; position: absolute; top: calc(100% + 8px); right: 0;
  width: 200px; background: var(--warm-white); border: 1px solid var(--border);
  border-radius: 6px; box-shadow: 0 8px 24px rgba(26,18,8,.22); z-index: 200; overflow: hidden;
}
.avatar-dropdown.open { display: block; }
.avatar-dropdown-name { padding: .6rem .8rem; font-size: .78rem; font-weight: 700; color: var(--ink); border-bottom: 1px solid var(--border); background: var(--panel); word-break: break-word; }
.avatar-dropdown-email { font-size: .64rem; color: var(--muted); font-weight: 400; margin-top: 1px; display: block; }
.avatar-dropdown-item {
  width: 100%; text-align: left; background: none; border: none; cursor: pointer;
  padding: .55rem .8rem; font-size: .78rem; color: var(--danger); font-weight: 700;
  font-family: 'Lato', sans-serif; transition: background .12s;
}
.avatar-dropdown-item:hover { background: #fbeaea; }

/* ── TEAM BAR ── */
.team-bar {
  background: var(--panel); border-bottom: 1px solid var(--border);
  min-height: var(--team-h); padding: .3rem 1rem;
  display: flex; align-items: center; gap: .7rem; flex-wrap: wrap;
  position: sticky; top: var(--header-h); z-index: 27;
}
.team-switcher { position: relative; flex-shrink: 0; }
.team-switch-btn {
  display: flex; align-items: center; gap: .35rem;
  background: var(--warm-white); border: 1px solid var(--border); border-radius: 20px;
  padding: .3rem .7rem; cursor: pointer; font-family: 'Playfair Display', serif;
  font-style: italic; font-size: .85rem; color: var(--brown); transition: background .15s;
}
.team-switch-btn:hover { background: var(--light-brown); }
.team-chevron { font-size: .6rem; color: var(--muted); }
.team-desc { font-size: .68rem; color: var(--muted); font-style: italic; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.team-members-strip { display: flex; align-items: center; gap: 3px; flex-shrink: 0; }
.member-more { font-size: .58rem; color: var(--muted); font-weight: 700; background: var(--light-brown); border-radius: 8px; padding: 1px 5px; }

/* ── PERSONAL BOARD MODE ── */
body.scope-mine { background: #f1e6d4; }
body.scope-mine .presence-bar, body.scope-mine .toolbar { background: #ece0cb; }
.scope-banner {
  background: var(--brown); color: var(--light-brown); text-align: center;
  font-family: 'Playfair Display', serif; font-style: italic; font-size: .88rem;
  padding: .55rem 1rem; border-radius: 6px; margin-bottom: 1rem; letter-spacing: .02em;
}
.team-chip-mini { font-size: .58rem; padding: 1px 7px; border-radius: 8px; background: var(--panel); border: 1px solid var(--border); color: var(--brown); font-weight: 700; white-space: nowrap; }
body.scope-mine .goal-card { border-left: 3px solid var(--brown); }
.team-menu {
  display: none; position: absolute; top: calc(100% + 6px); left: 0;
  width: 250px; background: var(--warm-white); border: 1px solid var(--border);
  border-radius: 6px; box-shadow: 0 8px 24px rgba(26,18,8,.2); z-index: 200; overflow: hidden;
}
.team-menu.open { display: block; }
.team-menu-label { font-size: .56rem; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: .5rem .8rem .2rem; }
.team-menu-list { max-height: 200px; overflow-y: auto; }
.team-menu-team {
  width: 100%; text-align: left; background: none; border: none; cursor: pointer;
  padding: .45rem .8rem; font-size: .8rem; color: var(--ink); font-family: 'Lato', sans-serif;
  transition: background .12s; display: block;
}
.team-menu-team:hover { background: var(--panel); }
.team-menu-team.active { background: var(--light-brown); font-weight: 700; }
.team-menu-divider { height: 1px; background: var(--border); margin: .2rem 0; }
.team-menu-item {
  width: 100%; text-align: left; background: none; border: none; cursor: pointer;
  padding: .5rem .8rem; font-size: .78rem; color: var(--brown); font-weight: 700;
  font-family: 'Lato', sans-serif; transition: background .12s;
}
.team-menu-item:hover { background: var(--panel); }

/* ── TOOLBAR / WEEK NAV ── */
.toolbar {
  background: var(--panel); border-bottom: 1px solid var(--border);
  padding: 0 1rem; height: var(--toolbar-h);
  display: flex; align-items: center; gap: .6rem;
  position: sticky; top: calc(var(--header-h) + var(--team-h)); z-index: 25;
  overflow-x: auto; overflow-y: hidden;
  scrollbar-width: none;
}
.toolbar::-webkit-scrollbar { display: none; }
.week-nav-btn {
  width: 26px; height: 26px; border-radius: 50%;
  border: 1px solid var(--border); background: var(--warm-white); color: var(--brown);
  cursor: pointer; font-size: .8rem; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s;
}
.week-nav-btn:hover { background: var(--light-brown); }
.week-label { font-family: 'Playfair Display', serif; font-style: italic; font-size: .88rem; color: var(--brown); white-space: nowrap; flex-shrink: 0; }
.toolbar-spacer { flex: 1; min-width: .25rem; }

.toggle-group { display: flex; align-items: center; gap: .35rem; flex-shrink: 0; }
.toggle-cap { font-size: .5rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; white-space: nowrap; }
.toggle-divider { width: 1px; height: 20px; background: var(--border); flex-shrink: 0; }

.vpill {
  font-family: 'Playfair Display', serif; font-style: italic; font-size: .8rem;
  color: var(--muted); padding: 3px 12px; border-radius: 20px;
  border: 1px solid transparent; background: transparent; cursor: pointer;
  transition: all .15s; white-space: nowrap;
}
.vpill:hover { color: var(--brown); border-color: var(--border); }
.vpill.active { background: var(--ink); color: var(--light-brown); border-color: var(--ink); font-style: normal; font-weight: 700; letter-spacing: .03em; }

/* scope pills get their own accent color so they're visually distinct from the view pills */
.spill {
  font-family: 'Playfair Display', serif; font-style: italic; font-size: .8rem;
  color: var(--muted); padding: 3px 12px; border-radius: 20px;
  border: 1px solid transparent; background: transparent; cursor: pointer;
  transition: all .15s; white-space: nowrap;
}
.spill:hover { color: var(--rust); border-color: var(--border); }
.spill.active { background: var(--rust); color: #fff; border-color: var(--rust); font-style: normal; font-weight: 700; letter-spacing: .03em; }

.today-jump {
  font-size: .62rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 700;
  color: var(--rust); background: none; border: 1px solid var(--rust); border-radius: 20px;
  padding: 4px 10px; cursor: pointer; flex-shrink: 0; transition: all .15s;
}
.today-jump:hover { background: var(--rust); color: #fff; }

/* ── PRESENCE ── */
.presence-bar {
  background: var(--warm-white); border-bottom: 1px solid var(--border);
  min-height: var(--presence-h);
  padding: .3rem 1rem; display: flex; align-items: center; gap: .5rem;
  flex-wrap: wrap; position: sticky; top: calc(var(--header-h) + var(--team-h) + var(--toolbar-h)); z-index: 24;
}
.presence-label { font-size: .58rem; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 700; flex-shrink: 0; }
.presence-list { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
.presence-chip { display: flex; align-items: center; gap: .3rem; }
.presence-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); flex-shrink: 0; box-shadow: 0 0 0 2px var(--success-pale); }
.presence-name { font-size: .68rem; color: var(--brown); font-weight: 700; }
.presence-empty { font-size: .68rem; color: var(--muted); font-style: italic; }

/* ── DAY PICKER (Today view) ── */
.day-picker { display: flex; justify-content: center; gap: .35rem; flex-wrap: wrap; margin-bottom: 1rem; }
.daypill {
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  min-width: 46px; padding: .35rem .3rem .3rem; border-radius: 8px;
  border: 1px solid var(--border); background: var(--warm-white); cursor: pointer;
  transition: all .15s; position: relative;
}
.daypill:hover { background: var(--light-brown); }
.daypill.active { background: var(--ink); border-color: var(--ink); }
.daypill.active .daypill-name, .daypill.active .daypill-date { color: var(--light-brown); }
.daypill.is-today:not(.active) { border-color: var(--rust); border-width: 2px; }
.daypill.is-past:not(.active) { opacity: .5; }
.daypill-name { font-size: .6rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.daypill-date { font-family: 'Playfair Display', serif; font-size: 1rem; color: var(--brown); }
.daypill.active .daypill-date { color: var(--light-brown); }
.daypill-tag { font-size: .48rem; letter-spacing: .08em; text-transform: uppercase; color: var(--rust); font-weight: 900; }
.daypill.active .daypill-tag { color: var(--gold); }
.past-note { text-align: center; font-size: .68rem; color: var(--muted); font-style: italic; margin: -.4rem 0 1rem; }

/* ── EDIT PANEL (owner / date / slot / visibility) ── */
.goal-edit-form { margin-top: .55rem; padding: .55rem .6rem; background: var(--panel); border-radius: 6px; display: flex; flex-direction: column; gap: .4rem; }
.edit-row { display: flex; align-items: center; gap: .5rem; }
.edit-row label { font-size: .58rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; width: 46px; flex-shrink: 0; }
.edit-row select, .edit-row input { flex: 1; padding: .32rem .45rem; border: 1px solid var(--border); border-radius: 4px; font-family: 'Lato', sans-serif; font-size: .8rem; background: var(--warm-white); outline: none; }
.edit-row select:focus, .edit-row input:focus { border-color: var(--gold); }
.edit-actions { display: flex; gap: .4rem; justify-content: flex-end; }
.gact.save { background: var(--gold); color: #fff; border-color: var(--gold); }
.gact.save:hover { background: #a87820; color: #fff; }

/* ── DRAG & DROP ── */
.goal-card[draggable="true"] { cursor: grab; }
.goal-card.dragging { opacity: .35; }
.goal-list { border-radius: 6px; transition: background .12s, outline .12s; min-height: 8px; }
.goal-list.drag-over { background: var(--light-brown); outline: 2px dashed var(--gold); outline-offset: 2px; }
.goal-list.drag-over-blocked, .wk-slot-body.drag-over-blocked { background: #f5dede; outline: 2px dashed var(--danger); outline-offset: 2px; cursor: not-allowed; }
.wk-slot-body { border-radius: 4px; transition: background .12s, outline .12s; min-height: 6px; }
.wk-slot-body.drag-over { background: var(--light-brown); outline: 2px dashed var(--gold); outline-offset: 1px; }
.wk-goal[draggable="true"] { cursor: grab; }
.wk-goal.dragging { opacity: .35; }
.drag-hint { text-align: center; font-size: .62rem; color: var(--muted); font-style: italic; margin: -.5rem 0 .8rem; }

/* ── MAIN ── */
.main { flex: 1; padding: 1rem 1rem 5rem; max-width: 980px; width: 100%; margin: 0 auto; }

/* ── TODAY VIEW ── */
.today-hero { text-align: center; margin-bottom: 1.1rem; }
.today-hero-day { font-family: 'Playfair Display', serif; font-style: italic; font-size: 1.7rem; color: var(--brown); }
.today-hero-sub { font-size: .62rem; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin-top: .1rem; }

.slot-section { margin-bottom: 1.3rem; }
.slot-hdr { display: flex; align-items: center; gap: .5rem; margin-bottom: .5rem; }
.slot-icon { font-size: 1rem; }
.slot-title { font-family: 'Playfair Display', serif; font-size: 1rem; color: var(--brown); }
.slot-count { background: var(--light-brown); color: var(--brown); border-radius: 10px; font-size: .6rem; font-weight: 700; padding: 1px 7px; }
.slot-line { flex: 1; height: 1px; background: var(--border); }

.goal-list { display: flex; flex-direction: column; gap: .5rem; }
.goal-card {
  background: var(--warm-white); border: 1px solid var(--border); border-radius: 6px;
  padding: .6rem .8rem; display: flex; align-items: flex-start; gap: .6rem;
  position: relative; transition: background .15s;
}
.goal-card.completed { background: var(--success-pale); border-color: rgba(42,122,74,.3); }
.goal-card.is-private { border-left: 3px solid var(--brown); }
.goal-check {
  width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; margin-top: 1px;
  border: 2px solid var(--border); background: transparent; cursor: pointer;
  display: flex; align-items: center; justify-content: center; font-size: .7rem; color: transparent;
  transition: all .15s;
}
.goal-check:hover { border-color: var(--success); }
.goal-card.completed .goal-check { background: var(--success); border-color: var(--success); color: #fff; }
.goal-body { flex: 1; min-width: 0; }
.goal-text { font-size: .9rem; line-height: 1.4; word-break: break-word; }
.goal-card.completed .goal-text { text-decoration: line-through; color: var(--muted); }
.goal-meta { display: flex; align-items: center; gap: .4rem; margin-top: .3rem; flex-wrap: wrap; }
.goal-owner { display: flex; align-items: center; gap: .3rem; }
.owner-avatar { width: 16px; height: 16px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
.owner-avatar-init { width: 16px; height: 16px; border-radius: 50%; background: var(--brown); color: var(--light-brown); font-size: .48rem; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.owner-name { font-size: .66rem; color: var(--muted); font-weight: 700; }
.rolled-badge { font-size: .58rem; color: var(--gold); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.private-badge { font-size: .58rem; color: var(--brown); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.goal-actions { display: flex; gap: .3rem; flex-shrink: 0; }
.gact {
  background: none; border: 1px solid var(--border); border-radius: 4px; cursor: pointer;
  font-size: .65rem; padding: .2rem .45rem; color: var(--muted); transition: all .15s;
}
.gact:hover { border-color: var(--rust); color: var(--rust); }
.gact.roll:hover { border-color: var(--gold); color: var(--gold); }
.gact.del:hover { border-color: var(--danger); color: var(--danger); }

.add-goal-row { display: flex; gap: .4rem; margin-top: .5rem; }
.add-goal-input {
  flex: 1; padding: .5rem .7rem; font-family: 'Lato', sans-serif; font-size: .88rem;
  border: 1px dashed var(--border); border-radius: 6px; background: var(--cream); outline: none;
  transition: border-color .15s;
}
.add-goal-input:focus { border-color: var(--gold); border-style: solid; background: var(--warm-white); }
.add-goal-btn {
  background: var(--rust); color: #fff; border: none; border-radius: 6px; padding: .5rem 1rem;
  font-size: .78rem; font-weight: 700; cursor: pointer; flex-shrink: 0; transition: background .15s;
}
.add-goal-btn:hover { background: #a04415; }
.empty-slot { font-size: .78rem; color: var(--muted); font-style: italic; padding: .3rem 0 .6rem; }
.add-goal-note { font-size: .62rem; color: var(--muted); font-style: italic; margin-top: .25rem; }
.add-goal-locked { font-size: .74rem; color: var(--muted); font-style: italic; padding: .5rem .1rem; opacity: .8; }

/* ── WEEK VIEW ── */
.week-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: .6rem; }
.day-col { border: 1px solid var(--border); border-radius: 6px; background: var(--warm-white); overflow: hidden; }
.day-col.is-today { border-color: var(--rust); box-shadow: 0 0 0 1px var(--rust); }
.day-col.is-past { opacity: .55; filter: grayscale(.35); }
.day-col-locked { font-size: .5rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-top: 1px; }
.day-col-hdr { background: var(--panel); padding: .4rem .5rem; text-align: center; border-bottom: 1px solid var(--border); }
.day-col-name { font-family: 'Playfair Display', serif; font-size: .82rem; color: var(--brown); }
.day-col-date { font-size: .58rem; color: var(--muted); }
.day-col-body { padding: .45rem; display: flex; flex-direction: column; gap: .5rem; }
.wk-slot-label { font-size: .55rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: .2rem; }
.wk-goal { font-size: .72rem; padding: .25rem .4rem; border-radius: 4px; background: var(--cream); border: 1px solid var(--border); margin-bottom: .25rem; word-break: break-word; }
.wk-goal.completed { background: var(--success-pale); text-decoration: line-through; color: var(--muted); border-color: rgba(42,122,74,.3); }
.wk-goal.is-private { border-left: 2px solid var(--brown); }
.wk-goal-owner { font-size: .58rem; color: var(--muted); display: block; margin-top: 1px; }
.wk-empty { font-size: .68rem; color: var(--muted); font-style: italic; }

@media (max-width: 800px) {
  .week-grid { grid-template-columns: 1fr; }
}

/* ── PRIORITY MATRIX (My Board only) ── */
.matrix-intro { text-align: center; font-size: .68rem; color: var(--muted); font-style: italic; margin-bottom: 1rem; }
.matrix-unrated { margin-bottom: 1.1rem; }
.matrix-unrated-hdr { display: flex; align-items: center; gap: .5rem; margin-bottom: .5rem; }
.matrix-unrated-title { font-family: 'Playfair Display', serif; font-size: .9rem; color: var(--brown); }
.matrix-unrated-line { flex: 1; height: 1px; background: var(--border); }
.matrix-unrated-tray {
  display: flex; gap: .5rem; overflow-x: auto; padding-bottom: .3rem;
  border-radius: 6px; transition: background .12s, outline .12s; min-height: 40px;
}
.matrix-unrated-tray.drag-over { background: var(--light-brown); outline: 2px dashed var(--gold); }
.matrix-unrated-empty { font-size: .74rem; color: var(--muted); font-style: italic; padding: .3rem; }

.matrix-wrap { display: flex; gap: .5rem; }
.matrix-axis-y { display: flex; flex-direction: column; justify-content: space-between; align-items: center; width: 22px; flex-shrink: 0; }
.matrix-axis-y span { writing-mode: vertical-rl; transform: rotate(180deg); font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; white-space: nowrap; }
.matrix-main { flex: 1; min-width: 0; }
.matrix-grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: .6rem; min-height: 380px; }
.matrix-quad {
  border: 1px solid var(--border); border-radius: 8px; padding: .6rem;
  display: flex; flex-direction: column; gap: .4rem; overflow-y: auto;
  transition: background .12s, outline .12s;
}
.matrix-quad.drag-over { outline: 2px dashed var(--gold); }
.matrix-quad.q-hi-hi { background: var(--success-pale); }
.matrix-quad.q-lo-hi { background: #eef6ea; }
.matrix-quad.q-hi-lo { background: #f2ebe0; }
.matrix-quad.q-lo-lo { background: #f9ebe8; }
.matrix-quad-title { font-family: 'Playfair Display', serif; font-size: .85rem; color: var(--brown); }
.matrix-quad-sub { font-size: .56rem; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; font-weight: 700; margin-top: -.3rem; }
.matrix-quad-empty { font-size: .7rem; color: var(--muted); font-style: italic; }
.matrix-axis-x { display: flex; justify-content: space-between; font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; padding: .4rem .3rem 0; }

.matrix-goal { background: var(--warm-white); border: 1px solid var(--border); border-radius: 6px; padding: .4rem .55rem; cursor: grab; transition: opacity .15s; }
.matrix-goal.dragging { opacity: .35; }
.matrix-goal-text { font-size: .78rem; line-height: 1.35; word-break: break-word; }
.matrix-goal-meta { font-size: .6rem; color: var(--muted); margin-top: 3px; display: flex; gap: .35rem; flex-wrap: wrap; align-items: center; }

/* ── MODAL ── */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,18,8,.55); z-index: 300; align-items: center; justify-content: center; padding: 1rem; }
.modal-overlay.open { display: flex; }
.modal { background: var(--warm-white); border: 1px solid var(--border); border-radius: 6px; padding: 1.6rem; width: 100%; max-width: 440px; box-shadow: 0 8px 32px rgba(26,18,8,.2); }
.modal h3 { font-family: 'Playfair Display', serif; font-size: 1.2rem; color: var(--brown); margin-bottom: 1rem; }
.form-row { margin-bottom: .8rem; }
.form-row label { display: block; font-size: .6rem; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: .28rem; }
.form-row input, .form-row textarea { width: 100%; padding: .55rem .8rem; font-family: 'Lato', sans-serif; font-size: .92rem; color: var(--ink); background: var(--cream); border: 1px solid var(--border); border-radius: 3px; outline: none; transition: border-color .15s; }
.form-row input:focus, .form-row textarea:focus { border-color: var(--gold); }
.form-row textarea { resize: vertical; min-height: 64px; line-height: 1.5; }
.form-note { font-size: .72rem; color: var(--muted); }
.form-note code { background: var(--panel); padding: 1px 5px; border-radius: 3px; font-size: .7rem; word-break: break-all; }
.modal-actions { display: flex; gap: .5rem; justify-content: flex-end; margin-top: 1rem; }
.btn { border: none; padding: .42rem .85rem; font-family: 'Lato', sans-serif; font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: background .15s; white-space: nowrap; }
.btn-save { background: var(--rust); color: #fff; } .btn-save:hover { background: #a04415; }
.btn-cancel { background: transparent; color: var(--muted); border: 1px solid var(--border); } .btn-cancel:hover { background: var(--light-brown); }

/* ── LOADING / TOAST ── */
#loadingScreen { position: fixed; inset: 0; background: var(--cream); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 1rem; z-index: 998; transition: opacity .4s; }
#loadingScreen.hidden { opacity: 0; pointer-events: none; }
.loading-title { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--brown); }
.loading-bar { width: 140px; height: 3px; background: var(--light-brown); border-radius: 2px; overflow: hidden; }
.loading-bar-inner { height: 100%; background: var(--gold); animation: loadSlide 1.2s ease-in-out infinite; }
@keyframes loadSlide { 0%{transform:translateX(-100%);width:40%}50%{width:60%}100%{transform:translateX(300%);width:40%} }
.toast { position: fixed; bottom: 1.4rem; right: 1.8rem; background: var(--ink); color: var(--light-brown); padding: .6rem 1.1rem; border-radius: 3px; font-size: .82rem; font-weight: 700; opacity: 0; transform: translateY(6px); transition: opacity .3s, transform .3s; pointer-events: none; z-index: 400; }
.toast.show { opacity: 1; transform: translateY(0); }

@media (max-width: 760px) {
  /* The toolbar previously relied on horizontal scroll with a hidden
     scrollbar, which meant the view/board toggles could be scrolled
     off-screen with no visual cue that more controls existed. On
     narrow screens it wraps onto multiple lines instead, and the bars
     above it drop out of the sticky stack so their (variable) wrapped
     height never overlaps the content below. */
  .team-bar, .toolbar, .presence-bar { position: static; }
  .toolbar { flex-wrap: wrap; height: auto; padding: .5rem .75rem; row-gap: .4rem; }
  .toolbar-spacer { display: none; }
  .toggle-group { flex-wrap: wrap; }
  .matrix-wrap { flex-direction: column; }
  .matrix-axis-y { display: none; }
  .matrix-grid { grid-template-columns: 1fr; grid-template-rows: none; min-height: auto; }
}

@media (max-width: 600px) {
  .main { padding: .8rem .75rem 5rem; }
  .brand-title { font-size: 1.05rem; }
  .brand-sub { font-size: .5rem; letter-spacing: .1em; }
}
</style>
</head>
<body>

<!-- Login -->
<div id="loginScreen">
  <div style="display:flex;flex-direction:column;align-items:center;gap:.3rem">
    <div class="login-title">Studio Board</div>
    <div class="login-sub">Daily Room Planning</div>
  </div>
  <div class="login-divider"></div>
  <div class="login-prompt">Sign in to continue</div>
  <button class="btn-google" id="btnGoogleSignIn">
    <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
    Sign in with Google
  </button>
</div>

<!-- Loading -->
<div id="loadingScreen">
  <div class="loading-title">Studio Board</div>
  <div class="loading-bar"><div class="loading-bar-inner"></div></div>
</div>

<!-- Header -->
<header>
  <div class="brand">
    <div class="brand-title">🛋️ Studio Board</div>
  </div>
  <div class="header-right">
    <span class="sync-dot" id="syncDot"></span>
    <div class="avatar-menu-wrap">
      <button class="avatar-btn" id="avatarBtn" onclick="toggleAvatarMenu()">
        <span id="userAvatarWrap"></span>
      </button>
      <div class="avatar-dropdown" id="avatarDropdown">
        <div class="avatar-dropdown-name" id="avatarDropdownName"></div>
        <button class="avatar-dropdown-item" onclick="signOutUser()">Sign out</button>
      </div>
    </div>
  </div>
</header>

<!-- Team bar -->
<div class="team-bar">
  <div class="team-switcher">
    <button class="team-switch-btn" onclick="toggleTeamMenu()">
      <span id="teamNameLabel">Loading…</span><span class="team-chevron">▾</span>
    </button>
    <div class="team-menu" id="teamMenu">
      <div class="team-menu-label">Your Teams</div>
      <div class="team-menu-list" id="teamMenuList"></div>
      <div class="team-menu-divider"></div>
      <button class="team-menu-item" onclick="openCreateTeamModal()">＋ New Team</button>
      <button class="team-menu-item" onclick="openJoinTeamModal()">🔗 Join a Team</button>
      <button class="team-menu-item" onclick="openTeamSettingsModal()">⚙ Board Settings</button>
    </div>
  </div>
  <div class="team-desc" id="teamDescLabel"></div>
  <div class="team-members-strip" id="teamMembersStrip"></div>
</div>

<!-- Toolbar -->
<div class="toolbar">
  <button class="week-nav-btn" onclick="shiftWeek(-1)" title="Previous week">‹</button>
  <div class="week-label" id="weekLabel"></div>
  <button class="week-nav-btn" onclick="shiftWeek(1)" title="Next week">›</button>
  <button class="today-jump" id="todayJumpBtn" onclick="jumpToToday()">Today</button>
  <div class="toolbar-spacer"></div>
  <div class="toggle-group">
    <span class="toggle-cap">Board</span>
    <div class="scope-toggle">
      <button class="spill active" id="scopeTeamBtn" onclick="setScope('team')" title="Everyone's public goals">Team Board</button>
      <button class="spill" id="scopeMineBtn" onclick="setScope('mine')" title="Just your goals, same days">My Board</button>
    </div>
  </div>
  <div class="toggle-divider"></div>
  <div class="toggle-group">
    <span class="toggle-cap">View</span>
    <div class="view-toggle">
      <button class="vpill active" id="viewTodayBtn" onclick="setView('today')">Day</button>
      <button class="vpill" id="viewWeekBtn" onclick="setView('week')">Week</button>
      <button class="vpill" id="viewMatrixBtn" onclick="setView('matrix')" style="display:none" title="Only available on My Board">Matrix</button>
    </div>
  </div>
</div>

<!-- Presence -->
<div class="presence-bar">
  <span class="presence-label">In the app</span>
  <div class="presence-list" id="presenceList"></div>
</div>

<main class="main"><div id="board"></div></main>

<!-- Generic modal (create/join team, board settings) -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn btn-save" id="modalSaveBtn">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp }   from "https://www.gstatic.com/firebasejs/11.8.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut as fbSignOut }
                           from "https://www.gstatic.com/firebasejs/11.8.0/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs, onSnapshot, addDoc, updateDoc,
         deleteDoc, setDoc, serverTimestamp, arrayUnion, query, where }
                           from "https://www.gstatic.com/firebasejs/11.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey:            "AIzaSyAKulZ1Z5rklbYR4DPKGsqRyq9DWUCI0ms",
  authDomain:        "etask-1d4f2.firebaseapp.com",
  projectId:         "etask-1d4f2",
  storageBucket:     "etask-1d4f2.firebasestorage.app",
  messagingSenderId: "634781794809",
  appId:             "1:634781794809:web:e779543498e891bee17d28"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);
const provider = new GoogleAuthProvider();

const DEFAULT_TEAM_ID = 'default-team';

let currentUser   = null;
let users         = {};       // uid -> {displayName, photoURL, lastSeen}
let goals         = [];       // all loaded goals across all teams (client filters by currentTeamId)
let teams         = {};       // teamId -> {name, description, memberUids, ownerUid}
let goalsUnsub    = null;
let usersUnsub    = null;
let teamsUnsub    = null;
let currentView   = 'today';  // 'today' | 'week'
let scopeFilter   = 'team';   // 'team' (everyone's public goals) | 'mine' (just current user)
let currentTeamId = DEFAULT_TEAM_ID;
let editingGoalId = null;     // id of the goal currently showing its inline edit panel
let weekOffset    = 0;        // 0 = this week, -1 = last week, +1 = next week
let selectedDate  = null;     // used in today view; snaps to nearest weekday, set after helpers are defined

// ── DATE HELPERS ──────────────────────────────────────────
// NOTE: dates are always formatted from local Y/M/D components (never via
// toISOString, which converts to UTC and can silently shift the date
// backward or forward depending on the browser's timezone offset).
function ymd(d) { const y=d.getFullYear(); const m=String(d.getMonth()+1).padStart(2,'0'); const dd=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${dd}`; }
function todayStr() { return ymd(new Date()); }
function parseYmd(s) { const [y,m,dd] = s.split('-').map(Number); return new Date(y, m-1, dd); }
function addDays(dateStr, n) { const d = parseYmd(dateStr); d.setDate(d.getDate()+n); return ymd(d); }
function dayOfWeek(dateStr) { return parseYmd(dateStr).getDay(); } // 0 Sun..6 Sat
function isWeekend(dateStr) { const w = dayOfWeek(dateStr); return w === 0 || w === 6; }
function nextWeekday(dateStr) { let d = addDays(dateStr, 1); while (isWeekend(d)) d = addDays(d, 1); return d; }
function mondayOf(dateStr) { const w = dayOfWeek(dateStr); const diff = w === 0 ? -6 : 1 - w; return addDays(dateStr, diff); }
const DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function fmtLong(dateStr) { const d = parseYmd(dateStr); return `${DAY_NAMES[d.getDay()]}, ${MONTHS[d.getMonth()]} ${d.getDate()}`; }
function fmtShort(dateStr) { const d = parseYmd(dateStr); return `${MONTHS[d.getMonth()].slice(0,3)} ${d.getDate()}`; }
function article(label) { return /^[aeiou]/i.test(label) ? 'an' : 'a'; }

function currentWeekMonday() {
  const base = addDays(todayStr(), weekOffset * 7);
  return mondayOf(base); // always Mon..Fri regardless of what today's weekday is
}
function weekDates() {
  const mon = currentWeekMonday();
  return [0,1,2,3,4].map(i => addDays(mon, i));
}

selectedDate = isWeekend(todayStr()) ? nextWeekday(todayStr()) : todayStr();

// ── AUTH ──────────────────────────────────────────────────
document.getElementById('btnGoogleSignIn').onclick = async () => {
  try { await signInWithPopup(auth, provider); }
  catch(e) { showToast('Sign-in failed'); console.error(e); }
};
window.signOutUser = async () => {
  if (goalsUnsub) { goalsUnsub(); goalsUnsub = null; }
  if (usersUnsub) { usersUnsub(); usersUnsub = null; }
  if (teamsUnsub) { teamsUnsub(); teamsUnsub = null; }
  stopHeartbeat();
  await fbSignOut(auth);
};

onAuthStateChanged(auth, async user => {
  if (user) {
    currentUser = user;
    document.getElementById('loginScreen').classList.add('hidden');
    setTimeout(() => document.getElementById('loginScreen').style.display = 'none', 420);
    renderHeaderUser(user);
    await setDoc(doc(db, 'users', user.uid), {
      displayName: user.displayName || user.email,
      email: user.email,
      photoURL: user.photoURL || '',
      lastSeen: serverTimestamp()
    }, { merge: true });
    currentTeamId = localStorage.getItem(`sb_team_${user.uid}`) || DEFAULT_TEAM_ID;
    scopeFilter = localStorage.getItem(`sb_scope_${user.uid}`) || 'team';
    currentView = localStorage.getItem(`sb_view_${user.uid}`) || 'today';
    if (currentView === 'matrix' && scopeFilter !== 'mine') currentView = 'today'; // guard against a stale/invalid combo
    document.getElementById('scopeTeamBtn').classList.toggle('active', scopeFilter === 'team');
    document.getElementById('scopeMineBtn').classList.toggle('active', scopeFilter === 'mine');
    document.body.classList.toggle('scope-mine', scopeFilter === 'mine');
    document.getElementById('viewMatrixBtn').style.display = scopeFilter === 'mine' ? '' : 'none';
    document.getElementById('viewTodayBtn').classList.toggle('active', currentView === 'today');
    document.getElementById('viewWeekBtn').classList.toggle('active', currentView === 'week');
    document.getElementById('viewMatrixBtn').classList.toggle('active', currentView === 'matrix');
    await ensureDefaultTeamMembership();
    await acceptPendingInvites();
    subscribeToUsers();
    subscribeToTeams();
    subscribeToGoals();
    setSyncState('loading');
    startHeartbeat();
  } else {
    currentUser = null;
    const ls = document.getElementById('loginScreen');
    ls.style.display = ''; ls.classList.remove('hidden');
    document.getElementById('userAvatarWrap').innerHTML = '';
    hideLoading();
  }
});

async function ensureDefaultTeamMembership() {
  try {
    const ref = doc(db, 'teams', DEFAULT_TEAM_ID);
    const snap = await getDoc(ref);
    if (!snap.exists()) {
      await setDoc(ref, {
        name: 'Room Planning Team',
        description: 'The original shared studio board',
        memberUids: [currentUser.uid],
        ownerUid: currentUser.uid,
        createdAt: serverTimestamp()
      });
    } else if (!(snap.data().memberUids || []).includes(currentUser.uid)) {
      await updateDoc(ref, { memberUids: arrayUnion(currentUser.uid) });
    }
  } catch (e) { console.error('ensureDefaultTeamMembership failed', e); }
}

// ── INVITES ───────────────────────────────────────────────
// There's no email-sending backend here — an "invite" just leaves a
// pending record matched on email. If that person later signs in with
// Google using that same email address, they're auto-added to the team
// on load. The inviter still has to tell them to go sign in; nothing
// gets emailed or pushed to them automatically.
async function acceptPendingInvites() {
  try {
    const q = query(collection(db, 'invites'), where('email', '==', (currentUser.email || '').toLowerCase()), where('status', '==', 'pending'));
    const snap = await getDocs(q);
    if (snap.empty) return;
    let joined = 0;
    for (const d of snap.docs) {
      const inv = d.data();
      await updateDoc(doc(db, 'teams', inv.teamId), { memberUids: arrayUnion(currentUser.uid) });
      await updateDoc(doc(db, 'invites', d.id), { status: 'accepted', acceptedAt: serverTimestamp() });
      joined++;
    }
    if (joined) showToast(`Joined ${joined} team${joined > 1 ? 's' : ''} via invite`);
  } catch (e) { console.error('acceptPendingInvites failed', e); }
}

function addableUserOptionsHTML(currentMemberUids) {
  const options = Object.entries(users)
    .filter(([uid]) => !currentMemberUids.includes(uid))
    .sort((a,b) => (userName(a[0])||'').localeCompare(userName(b[0])||''))
    .map(([uid,u]) => `<option value="${uid}">${esc(u.displayName || u.email || 'Someone')}</option>`)
    .join('');
  return options || '<option value="">No other known users</option>';
}

window.addMemberDirectly = async function(teamId) {
  const uid = document.getElementById('addMemberSelect').value;
  if (!uid) { showToast('No user selected'); return; }
  await updateDoc(doc(db, 'teams', teamId), { memberUids: arrayUnion(uid) });
  showToast(`Added ${userName(uid)} to the team`);
  openTeamSettingsModal(); // re-render the modal with the updated member list
};

window.sendInvite = async function(teamId) {
  const input = document.getElementById('inviteEmailInput');
  const email = (input.value || '').trim().toLowerCase();
  if (!email || !email.includes('@')) { showToast('Enter a valid email'); return; }
  await addDoc(collection(db, 'invites'), {
    teamId, email,
    invitedBy: currentUser.uid,
    invitedByName: currentUser.displayName || currentUser.email,
    status: 'pending',
    createdAt: serverTimestamp()
  });
  input.value = '';
  showToast(`Invite recorded for ${email} — have them sign in to join`);
  refreshPendingInvitesList(teamId);
};

async function refreshPendingInvitesList(teamId) {
  const el = document.getElementById('pendingInvitesList');
  if (!el) return;
  try {
    const q = query(collection(db, 'invites'), where('teamId', '==', teamId), where('status', '==', 'pending'));
    const snap = await getDocs(q);
    el.innerHTML = snap.empty
      ? '<div style="font-size:.7rem;color:var(--muted);font-style:italic">No pending invites</div>'
      : snap.docs.map(d => `<div style="font-size:.74rem;padding:.15rem 0">${esc(d.data().email)} <span style="color:var(--muted)">— pending</span></div>`).join('');
  } catch (e) {
    el.innerHTML = '<div style="font-size:.7rem;color:var(--muted);font-style:italic">Couldn\'t load invites</div>';
  }
}

// ── PRESENCE ──────────────────────────────────────────────
const ONLINE_WINDOW_MS = 90000;
let heartbeatTimer = null;
let presenceTickTimer = null;
function startHeartbeat() {
  touchLastSeen();
  heartbeatTimer = setInterval(touchLastSeen, 25000);
  presenceTickTimer = setInterval(renderPresence, 15000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) touchLastSeen(); });
}
function stopHeartbeat() {
  if (heartbeatTimer) clearInterval(heartbeatTimer);
  if (presenceTickTimer) clearInterval(presenceTickTimer);
  heartbeatTimer = null; presenceTickTimer = null;
}
async function touchLastSeen() {
  if (!currentUser) return;
  try { await setDoc(doc(db, 'users', currentUser.uid), { lastSeen: serverTimestamp() }, { merge: true }); }
  catch (e) { console.error('heartbeat failed', e); }
}
function isOnline(u) {
  if (!u || !u.lastSeen) return false;
  const t = u.lastSeen.toDate ? u.lastSeen.toDate() : new Date(u.lastSeen);
  return (Date.now() - t.getTime()) < ONLINE_WINDOW_MS;
}
function renderPresence() {
  const list = document.getElementById('presenceList');
  if (!list) return;
  const online = Object.entries(users).filter(([uid, u]) => isOnline(u));
  if (!online.length) { list.innerHTML = '<span class="presence-empty">No one else online</span>'; return; }
  list.innerHTML = online.map(([uid, u]) => `
    <span class="presence-chip">
      <span class="presence-dot"></span>
      <span class="presence-name">${esc(u.displayName || u.email || 'Someone')}</span>
    </span>
  `).join('');
}

function renderHeaderUser(user) {
  const wrap = document.getElementById('userAvatarWrap');
  if (user.photoURL) {
    wrap.innerHTML = `<img class="user-avatar" src="${esc(user.photoURL)}" alt="${esc(user.displayName||'')}"/>`;
  } else {
    const i = (user.displayName||user.email||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
    wrap.innerHTML = `<div class="user-avatar-initials">${i}</div>`;
  }
  document.getElementById('avatarDropdownName').innerHTML =

// ── GOALS ─────────────────────────────────────────────────
function subscribeToGoals() {
  if (goalsUnsub) goalsUnsub();
  goalsUnsub = onSnapshot(collection(db, 'goals'), snap => {
    goals = [];
    snap.forEach(d => goals.push({ id: d.id, ...d.data() }));
    setSyncState('live');
    hideLoading();
    rolloverOverdueGoals();
    render();
  }, err => { console.error(err); setSyncState('error'); });
}

// Two cleanup passes run every time goals load:
//  1) Weekend fix — any goal (complete or not) that ended up dated on a
//     Sat/Sun is invalid in this Mon-Fri-only app and would otherwise be
//     permanently invisible (the UI never renders weekend columns). This
//     mainly catches goals created before a timezone bug in an earlier
//     version was fixed, which could silently shift dates onto a weekend.
//  2) Rollover — any incomplete goal left on a past weekday moves to the
//     next available weekday (today, if today is Mon-Fri and still ahead).
let rollingInFlight = new Set();
async function rolloverOverdueGoals() {
  const today = todayStr();
  const target = isWeekend(today) ? nextWeekday(today) : today;

  const weekendStuck = goals.filter(g => isWeekend(g.date) && !rollingInFlight.has(g.id));
  for (const g of weekendStuck) {
    rollingInFlight.add(g.id);
    try {
      await updateDoc(doc(db, 'goals', g.id), {
        date: nextWeekday(g.date),
        rolled: true,
        rolledFrom: g.rolledFrom || g.date
      });
    } catch (e) { console.error('weekend fix failed', e); }
    finally { rollingInFlight.delete(g.id); }
  }

  const overdue = goals.filter(g => !g.completed && !isWeekend(g.date) && g.date < target && !rollingInFlight.has(g.id));
  for (const g of overdue) {
    rollingInFlight.add(g.id);
    try {
      await updateDoc(doc(db, 'goals', g.id), {
        date: target,
        rolled: true,
        rolledFrom: g.rolledFrom || g.date
      });
    } catch (e) { console.error('rollover failed', e); }
    finally { rollingInFlight.delete(g.id); }
  }
}

function goalsFor(dateStr, slot) {
  const myUid = currentUser && currentUser.uid;
  let list = goals.filter(g => g.date === dateStr && g.slot === slot);
  if (scopeFilter === 'mine') {
    // My Board shows every goal you own, across every team you're in —
    // not just the currently selected team.
    list = list.filter(g => g.uid === myUid);
  } else {
    list = list
      .filter(g => (g.teamId || DEFAULT_TEAM_ID) === currentTeamId)
      .filter(g => g.uid === myUid || g.visibility !== 'private'); // private goals only visible to their owner
  }
  return list.sort((a,b) => (a.order ?? a.createdAtMs ?? 0) - (b.order ?? b.createdAtMs ?? 0));
}

window.shiftWeek = function(n) {
  weekOffset += n;
  const wd = weekDates();
  selectedDate = wd[0];
  render();
};

window.jumpToToday = function() {
  weekOffset = 0;
  selectedDate = isWeekend(todayStr()) ? nextWeekday(todayStr()) : todayStr();
  render();
};

// ── RENDER ────────────────────────────────────────────────
function render() {
  const wd = weekDates(); // always exactly Mon..Fri of the displayed week
  let weekSuffix;
  if (weekOffset === 0) weekSuffix = 'This Week';
  else if (weekOffset === -1) weekSuffix = 'Last Week';
  else if (weekOffset === 1) weekSuffix = 'Next Week';
  else weekSuffix = weekOffset < 0 ? `${-weekOffset} Weeks Ago` : `${weekOffset} Weeks From Now`;
  document.getElementById('weekLabel').textContent =
    `${fmtShort(wd[0])} – ${fmtShort(wd[4])} · ${weekSuffix}`;

  if (currentView === 'today') {
    if (!wd.includes(selectedDate)) selectedDate = (weekOffset === 0 && !isWeekend(todayStr())) ? todayStr() : wd[0];
  }

  // Date navigation doesn't apply to the Matrix view (it spans all future days at once).
  const dateNavRelevant = currentView !== 'matrix';
  document.querySelectorAll('.week-nav-btn').forEach(b => b.style.display = dateNavRelevant ? '' : 'none');
  document.getElementById('weekLabel').style.display = dateNavRelevant ? '' : 'none';
  // "Today" jump button only shows when date-nav is relevant AND you're not already looking at today.
  const atHome = currentView === 'today' && weekOffset === 0 && selectedDate === todayStr();
  document.getElementById('todayJumpBtn').style.display = (dateNavRelevant && !atHome) ? '' : 'none';

  const board = document.getElementById('board');
  const banner = scopeFilter === 'mine' && currentView !== 'matrix'
    ? `<div class="scope-banner">🔒 My Board — every goal you own, across all your teams</div>`
    : '';
  const viewHTML = currentView === 'today' ? renderTodayView(selectedDate, wd)
                  : currentView === 'week'  ? renderWeekView(wd)
                  : renderMatrixView();
  board.innerHTML = banner + viewHTML;
}

function renderTodayView(dateStr, wd) {
  const todayActual = todayStr();
  const dayPicker = `
    <div class="day-picker">
      ${wd.map(d => `
        <button class="daypill ${d===dateStr?'active':''} ${d===todayActual?'is-today':''} ${d<todayActual?'is-past':''}" onclick="selectDay('${d}')" title="${fmtLong(d)}">
          <span class="daypill-name">${DAY_NAMES[parseYmd(d).getDay()].slice(0,3)}</span>
          <span class="daypill-date">${parseYmd(d).getDate()}</span>
          ${d===todayActual ? '<span class="daypill-tag">Today</span>' : (d < todayActual ? '<span class="daypill-tag" style="color:var(--muted)">Past</span>' : '')}
        </button>
      `).join('')}
    </div>`;

  const viewingPast = dateStr < todayActual;
  const pastNote = viewingPast
    ? `<div class="past-note">Viewing a past day — anything left unfinished here has already rolled forward to the next open day.</div>`
    : '';

  return `
    ${dayPicker}
    <div class="today-hero">
      <div class="today-hero-day">${fmtLong(dateStr)}</div>
      <div class="today-hero-sub">${dateStr === todayActual ? 'Today' : (viewingPast ? 'Past day' : 'Upcoming')}</div>
    </div>
    <div class="drag-hint">Drag a goal to reorder it, move it to a different slot, or drop it on another day in Week view. Click ✎ for owner, date, slot, or visibility.</div>
    ${pastNote}
    ${slotSectionHTML(dateStr, 'morning', '🌅', 'Morning')}
    ${slotSectionHTML(dateStr, 'afternoon', '🪑', 'Afternoon')}
  `;
}

window.selectDay = function(d) { selectedDate = d; render(); };

function slotSectionHTML(dateStr, slot, icon, label) {
  const list = goalsFor(dateStr, slot);
  const past = isPastDate(dateStr);
  const addArea = past
    ? `<div class="add-goal-locked">🔒 Past day — locked. Anything left unfinished here already rolled forward to today.</div>`
    : `
      <div class="add-goal-row">
        <input class="add-goal-input" id="add-${dateStr}-${slot}" placeholder="Add ${article(label)} ${label.toLowerCase()} goal…" onkeydown="addGoalKeydown(event,'${dateStr}','${slot}')"/>
        <button class="add-goal-btn" onclick="addGoal('${dateStr}','${slot}')">Add</button>
      </div>
      <div class="add-goal-note">${scopeFilter === 'mine' ? '🔒 New goals here start private (only you).' : '🌐 New goals here start public (visible to the team).'}</div>
    `;
  return `
    <div class="slot-section">
      <div class="slot-hdr">
        <span class="slot-icon">${icon}</span>
        <span class="slot-title">${label}</span>
        <span class="slot-count">${list.length}</span>
        <div class="slot-line"></div>
      </div>
      <div class="goal-list"
           ondragover="onSlotDragOver(event,'${dateStr}')"
           ondragleave="onSlotDragLeave(event)"
           ondrop="onSlotDrop(event,'${dateStr}','${slot}')">
        ${list.length ? list.map(goalCardHTML).join('') : `<div class="empty-slot">Nothing planned yet${past ? '' : ' — or drag a goal here'}</div>`}
      </div>
      ${addArea}
    </div>
  `;
}

        <button class="gact save" onclick="saveGoalEdit('${g.id}')">Save</button>

window.saveGoalEdit = async function(id) {
  const uid        = document.getElementById(`edit-owner-${id}`).value;
  const date       = document.getElementById(`edit-date-${id}`).value;
  const slot       = document.getElementById(`edit-slot-${id}`).value;
  const visibility = document.getElementById(`edit-vis-${id}`).value;
  const effortRaw  = document.getElementById(`edit-effort-${id}`).value;
  const rewardRaw  = document.getElementById(`edit-reward-${id}`).value;
  if (!date) { showToast('Pick a date'); return; }
  if (date < todayStr()) { showToast('Pick today or a future date — past days are locked'); return; }
  if (isWeekend(date)) { showToast('Pick a weekday — Mon to Fri only'); return; }
  await updateDoc(doc(db, 'goals', id), {
    uid, date, slot, visibility, rolled: false,
    effort: effortRaw ? Number(effortRaw) : null,
    reward: rewardRaw ? Number(rewardRaw) : null
  });
  editingGoalId = null;
  showToast('Goal updated');
};

// ── DRAG & DROP ──────────────────────────────────────────
// Dropping on a specific goal card reorders within that slot (or moves +
// inserts at that position if coming from elsewhere). Dropping on the
// empty area of a slot appends to the end of that slot.
window.onGoalDragStart = function(e, id) {
  e.dataTransfer.setData('text/plain', id);
  e.dataTransfer.effectAllowed = 'move';
  e.currentTarget.classList.add('dragging');
};
window.onGoalDragEnd = function(e) {
  e.currentTarget.classList.remove('dragging');
};
function isPastDate(dateStr) { return dateStr < todayStr(); }
window.onSlotDragOver = function(e, dateStr) {
  e.preventDefault();
  if (dateStr && isPastDate(dateStr)) {
    e.dataTransfer.dropEffect = 'none';
    e.currentTarget.classList.add('drag-over-blocked');
    return;
  }
  e.currentTarget.classList.add('drag-over');
};
window.onSlotDragLeave = function(e) {
  e.currentTarget.classList.remove('drag-over');
  e.currentTarget.classList.remove('drag-over-blocked');
};
window.onSlotDrop = async function(e, dateStr, slot) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  e.currentTarget.classList.remove('drag-over-blocked');
  if (isPastDate(dateStr)) { showToast("Can't move goals to a past day"); return; }
  const id = e.dataTransfer.getData('text/plain');
  if (!id) return;
  const g = goals.find(x => x.id === id);
  if (!g || (g.date === dateStr && g.slot === slot)) return;
  const list = goalsFor(dateStr, slot);
  await updateDoc(doc(db, 'goals', id), { date: dateStr, slot, rolled: false, order: (list[list.length-1]?.order ?? 0) + 1 });
  showToast(`Moved to ${fmtShort(dateStr)} · ${slot}`);
};
window.onGoalCardDrop = async function(e, targetId) {
  e.preventDefault();
  e.stopPropagation();
  const sourceId = e.dataTransfer.getData('text/plain');
  if (!sourceId || sourceId === targetId) return;
  const target = goals.find(x => x.id === targetId);
  const source = goals.find(x => x.id === sourceId);
  if (!target || !source) return;
  if (isPastDate(target.date)) { showToast("Can't move goals to a past day"); return; }
  const sameList = source.date === target.date && source.slot === target.slot;
  let list = goalsFor(target.date, target.slot).filter(x => x.id !== sourceId);
  const idx = list.findIndex(x => x.id === targetId);
  list.splice(idx, 0, source);
  const updates = list.map((g, i) => {
    const patch = { order: i };
    if (g.id === sourceId) {
      patch.date = target.date;
      patch.slot = target.slot;
      if (!sameList) patch.rolled = false;
    }
    return updateDoc(doc(db, 'goals', g.id), patch);
  });
  await Promise.all(updates);
  showToast(sameList ? 'Reordered' : `Moved to ${fmtShort(target.date)} · ${target.slot}`);
};

function renderWeekView(wd) {
  const today = todayStr();
  return `
    <div class="week-grid">
      ${wd.map(d => `
        <div class="day-col ${d===today?'is-today':''} ${d<today?'is-past':''}">
          <div class="day-col-hdr">
            <div class="day-col-name">${DAY_NAMES[parseYmd(d).getDay()]}</div>
            <div class="day-col-date">${fmtShort(d)}</div>
            ${d<today ? '<div class="day-col-locked">🔒 Locked</div>' : ''}
          </div>
          <div class="day-col-body">
            ${weekSlotHTML(d, 'morning', '🌅')}
            ${weekSlotHTML(d, 'afternoon', '🪑')}
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function weekSlotHTML(dateStr, slot, icon) {
  const list = goalsFor(dateStr, slot);
  return `
    <div>
      <div class="wk-slot-label">${icon} ${slot}</div>
      <div class="wk-slot-body"
           ondragover="onSlotDragOver(event,'${dateStr}')"
           ondragleave="onSlotDragLeave(event)"
           ondrop="onSlotDrop(event,'${dateStr}','${slot}')">
        ${list.length ? list.map(g => `
          <div class="wk-goal ${g.completed?'completed':''} ${g.visibility==='private'?'is-private':''}"
               draggable="true"
               ondragstart="onGoalDragStart(event,'${g.id}')"
               ondragend="onGoalDragEnd(event)"
               ondragover="event.preventDefault(); event.stopPropagation();"
               ondrop="onGoalCardDrop(event,'${g.id}')"
               onclick="setView('today');selectDay('${dateStr}')">
            ${esc(g.text)}
            <span class="wk-goal-owner">${esc(userName(g.uid))}</span>
          </div>
        `).join('') : `<div class="wk-empty">— drop here —</div>`}
      </div>
    </div>
  `;
}

// ── PRIORITY MATRIX ──────────────────────────────────────
// Only meaningful on My Board (it's a personal prioritization tool, not
// a team view). Pulls every incomplete goal you own dated today or later,
// across every team — same "all your goals" philosophy as My Board itself.
// Effort/Reward are each 1 (Low) or 2 (High); dragging a goal onto a
// quadrant sets both fields at once.
function myFutureGoalsForMatrix() {
  const myUid = currentUser && currentUser.uid;
  const today = todayStr();
  return goals.filter(g => g.uid === myUid && !g.completed && g.date >= today);
}

function renderMatrixView() {
  const mine = myFutureGoalsForMatrix();
  const unrated = mine.filter(g => !g.effort || !g.reward);
  const quad = (effort, reward) => mine.filter(g => g.effort === effort && g.reward === reward);

  return `
    <div class="matrix-intro">Every future goal you own, across every team. Drag a card into a quadrant to set its priority.</div>
    <div class="add-goal-row" style="margin-bottom:1rem">
      <input class="add-goal-input" id="matrixNewGoalInput" placeholder="Add a goal — lands in Needs Rating, on today's date" onkeydown="matrixAddGoalKeydown(event)"/>
      <button class="add-goal-btn" onclick="addGoalFromMatrix()">Add</button>
    </div>
    <div class="matrix-unrated">
      <div class="matrix-unrated-hdr">
        <span class="matrix-unrated-title">Needs Rating (${unrated.length})</span>
        <div class="matrix-unrated-line"></div>
      </div>
      <div class="matrix-unrated-tray"
           ondragover="onMatrixDragOver(event)" ondragleave="onMatrixDragLeave(event)" ondrop="onMatrixTrayDrop(event)">
        ${unrated.length ? unrated.map(g => matrixGoalHTML(g, null, null)).join('') : `<div class="matrix-unrated-empty">Nothing waiting to be rated</div>`}
      </div>
    </div>
    <div class="matrix-wrap">
      <div class="matrix-axis-y"><span>High Reward</span><span>Low Reward</span></div>
      <div class="matrix-main">
        <div class="matrix-grid">
          ${matrixQuadHTML('q-lo-hi', 'Showroom Wins', 'Low effort · High reward', quad(1,2))}
          ${matrixQuadHTML('q-hi-hi', 'Signature Pieces', 'High effort · High reward', quad(2,2))}
          ${matrixQuadHTML('q-lo-lo', 'Quick Tidy', 'Low effort · Low reward', quad(1,1))}
          ${matrixQuadHTML('q-hi-lo', 'Back of the Warehouse', 'High effort · Low reward', quad(2,1))}
        </div>
        <div class="matrix-axis-x"><span>Low Effort</span><span>High Effort</span></div>
      </div>
    </div>
  `;
}

function matrixQuadHTML(cls, title, sub, list) {
  const [effort, reward] = cls === 'q-lo-hi' ? [1,2] : cls === 'q-hi-hi' ? [2,2] : cls === 'q-lo-lo' ? [1,1] : [2,1];
  return `
    <div class="matrix-quad ${cls}"
         ondragover="onMatrixDragOver(event)" ondragleave="onMatrixDragLeave(event)" ondrop="onMatrixDrop(event,${effort},${reward})">
      <div class="matrix-quad-title">${title}</div>
      <div class="matrix-quad-sub">${sub}</div>
      ${list.length ? list.map(g => matrixGoalHTML(g, effort, reward)).join('') : `<div class="matrix-quad-empty">Drop a goal here</div>`}
    </div>
  `;
}

// Matrix cards reuse the same anatomy as every other goal tile (check,
// owner, ✎ edit / ↻ roll / ✕ delete) so goals act identically everywhere —
// clicking never jumps views. Dropping directly onto a card sets the same
// effort/reward as dropping on the quadrant it's in.
function matrixGoalHTML(g, effort, reward) {
  const editing = g.id === editingGoalId;
  const isPrivate = g.visibility === 'private';
  return `
    <div class="goal-card matrix-goal ${g.completed ? 'completed' : ''} ${isPrivate ? 'is-private' : ''}"
         draggable="true"
         ondragstart="onGoalDragStart(event,'${g.id}')"
         ondragend="onGoalDragEnd(event)"
         ondragover="event.preventDefault(); event.stopPropagation();"
         ondrop="onMatrixCardDrop(event,${effort===null?'null':effort},${reward===null?'null':reward})">
      <button class="goal-check" onclick="toggleGoal('${g.id}')">${g.completed ? '✓' : ''}</button>
      <div class="goal-body">
        <div class="goal-text">${esc(g.text)}</div>
        <div class="goal-meta">
          <span class="goal-owner">${avatarHTML(g.uid)}<span class="owner-name">${esc(userName(g.uid))}</span></span>
          ${isPrivate ? `<span class="private-badge">🔒 private</span>` : ''}
          ${g.rolled ? `<span class="rolled-badge">↻ rolled</span>` : ''}
          <span class="team-chip-mini">${esc(teamName(g.teamId))}</span>
          <span class="team-chip-mini">${fmtShort(g.date)}${g.date===todayStr()?' · Today':''}</span>
        </div>
        ${editing ? goalEditFormHTML(g) : ''}
      </div>
      <div class="goal-actions">
        <button class="gact" onclick="toggleEditGoal('${g.id}')" title="Change owner, date, slot or visibility">✎</button>
        <button class="gact roll" onclick="rollGoal('${g.id}')" title="Move to next day">↻</button>
        <button class="gact del" onclick="deleteGoal('${g.id}')" title="Delete">✕</button>
      </div>
    </div>
  `;
}

window.onMatrixCardDrop = async function(e, effort, reward) {
  e.preventDefault();
  e.stopPropagation();
  const id = e.dataTransfer.getData('text/plain');
  if (!id) return;
  await updateDoc(doc(db, 'goals', id), { effort, reward });
  showToast(effort === null ? 'Moved back to unrated' : 'Priority updated');
};

window.onMatrixDragOver = function(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); };
window.onMatrixDragLeave = function(e) { e.currentTarget.classList.remove('drag-over'); };
window.onMatrixDrop = async function(e, effort, reward) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  const id = e.dataTransfer.getData('text/plain');
  if (!id) return;
  await updateDoc(doc(db, 'goals', id), { effort, reward });
  showToast('Priority updated');
};
window.onMatrixTrayDrop = async function(e) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  const id = e.dataTransfer.getData('text/plain');
  if (!id) return;
  await updateDoc(doc(db, 'goals', id), { effort: null, reward: null });
  showToast('Moved back to unrated');
};

// ── UTIL ──────────────────────────────────────────────────
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function setSyncState(state) { document.getElementById('syncDot').className = `sync-dot ${state}`; }
function hideLoading(){ const ls=document.getElementById('loadingScreen'); ls.classList.add('hidden'); setTimeout(()=>ls.style.display='none',420); }
window.showToast = msg => {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window._toastT);
  window._toastT = setTimeout(()=>t.classList.remove('show'), 2400);
};
</script>
</body>
</html>
